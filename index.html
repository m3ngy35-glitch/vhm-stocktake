<!doctype html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VHM Stock Take</title>
<meta name="description" content="Bracket-grid stock counting, dashboard, history and reports for VHM Club, synced live across staff phones via Firebase.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VHM Stock">
<meta name="theme-color" content="#1F3A5F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --primary:#1F3A5F; --primary-ink:#16304f; --primary-tint:#E7ECF3;
  --bg:#F7F8FA; --card:#FFFFFF; --text:#171A1F; --text-2:#6B7280;
  --success:#16803C; --success-bg:#E7F5EC;
  --warning:#C77700; --warning-bg:#FDF1E0;
  --danger:#C62828; --danger-bg:#FBEAEA;
  --gray-bg:#EEF0F3; --gray-ink:#6B7280;
  --border:#E5E7EB;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(23,26,31,.05), 0 2px 10px rgba(23,26,31,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#7BA0D4; --primary-ink:#9AB6DE; --primary-tint:rgba(123,160,212,.14);
    --bg:#12161C; --card:#1A2028; --text:#EDEFF2; --text-2:#98A2B3;
    --success:#3FB56C; --success-bg:rgba(63,181,108,.14);
    --warning:#E2A03F; --warning-bg:rgba(226,160,63,.14);
    --danger:#E2645F; --danger-bg:rgba(226,100,95,.14);
    --gray-bg:#232A34; --gray-ink:#98A2B3;
    --border:#28303B;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 14px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#7BA0D4; --primary-ink:#9AB6DE; --primary-tint:rgba(123,160,212,.14);
  --bg:#12161C; --card:#1A2028; --text:#EDEFF2; --text-2:#98A2B3;
  --success:#3FB56C; --success-bg:rgba(63,181,108,.14);
  --warning:#E2A03F; --warning-bg:rgba(226,160,63,.14);
  --danger:#E2645F; --danger-bg:rgba(226,100,95,.14);
  --gray-bg:#232A34; --gray-ink:#98A2B3;
  --border:#28303B;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 14px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;}
h1,h2,h3,.num,.mono{font-family:'Manrope',system-ui,sans-serif;}
.num{font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}
a{color:var(--primary);}
::selection{background:var(--primary-tint);}
[hidden]{display:none!important;}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-sm{width:16px;height:16px;}
.icon-lg{width:28px;height:28px;}

#app{min-height:100vh;display:flex;}
.sidebar{width:232px;flex:none;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Manrope',sans-serif;font-size:15px;flex:none;}
.brand-text b{display:block;font-size:14.5px;font-weight:800;letter-spacing:.2px;}
.brand-text span{display:block;font-size:11px;color:var(--text-2);}
.navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
.navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.navlink:hover{background:var(--gray-bg);color:var(--text);}
.navlink.active{background:var(--primary-tint);color:var(--primary-ink);}
.navlink.active .icon{stroke:var(--primary-ink);}
.sidebar-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);padding:6px 10px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;}
.dot.offline{background:var(--gray-ink);}

.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.topbar h1{margin:0;font-size:19px;font-weight:800;}
.topbar-sub{color:var(--text-2);font-size:12.5px;margin-top:2px;}
.view{padding:2px 20px 100px;flex:1;}

.bottomnav{display:none;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:16px;}
.grid{display:grid;gap:14px;}
.kpis{grid-template-columns:repeat(4,1fr);}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;}
.kpi .label{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.kpi .value{font-size:26px;font-weight:800;}
.kpi .sub{font-size:11.5px;color:var(--text-2);}
.two-col{grid-template-columns:1.3fr 1fr;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:15px;margin:0;font-weight:800;}
.section-title .hint{font-size:12px;color:var(--text-2);}

.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:14px 18px;font-size:14.5px;}
.btn:disabled{opacity:.45;pointer-events:none;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
.badge-match{background:var(--success-bg);color:var(--success);}
.badge-short{background:var(--danger-bg);color:var(--danger);}
.badge-extra{background:var(--warning-bg);color:var(--warning);}
.badge-none{background:var(--gray-bg);color:var(--gray-ink);}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--text-2);}
.field-row{display:grid;gap:10px;grid-template-columns:1fr 1fr;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--gray-bg);}

.swatch{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none;display:inline-block;vertical-align:-3px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);font-size:12.5px;font-weight:600;background:var(--card);}

.stickybar{position:sticky;z-index:15;background:var(--bg);padding:10px 0;}
.st-controls{display:flex;flex-wrap:wrap;gap:8px;top:calc(0px + env(safe-area-inset-top,0px));}
.st-controls select,.st-controls input{width:auto;min-width:110px;}
.searchbar{position:relative;flex:1;min-width:180px;}
.searchbar .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-2);}
.searchbar input{padding-left:34px;}

.codecard{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;}
.codecard:active{transform:scale(.995);}
.codecard .swatchgroup{display:flex;gap:-4px;}
.codecard .cc-main{flex:1;min-width:0;}
.codecard .cc-main b{font-size:14.5px;}
.codecard .cc-sub{color:var(--text-2);font-size:12px;margin-top:2px;}
.progressbar{height:6px;border-radius:99px;background:var(--gray-bg);overflow:hidden;margin-top:8px;}
.progressbar>span{display:block;height:100%;background:var(--primary);}

.bracket{display:grid;gap:8px;}
.bracket-row{display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:minmax(74px,1fr);}
.bcell{border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;background:var(--card);}
.bcell:active{transform:scale(.96);}
.bcell .bc-qty{font-size:17px;font-weight:800;font-family:'Manrope',sans-serif;}
.bcell .bc-sys{font-size:10.5px;color:var(--text-2);}
.bcell.st-match{border-color:var(--success);background:var(--success-bg);}
.bcell.st-short{border-color:var(--danger);background:var(--danger-bg);}
.bcell.st-extra{border-color:var(--warning);background:var(--warning-bg);}
.bracket-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--text-2);}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-backdrop.center{align-items:center;padding:16px;}
.modal-sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
.modal-backdrop.center .modal-sheet{border-radius:16px;}
.modal-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}

.keypad-display{text-align:center;padding:14px 0 8px;}
.keypad-display .qtybig{font-size:52px;font-weight:800;font-family:'Manrope',sans-serif;}
.keypad-display .sysline{color:var(--text-2);font-size:12.5px;margin-top:2px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px;}
.stepbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--gray-bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;}
.stepbtn:active{transform:scale(.94);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.keypad button{padding:14px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:18px;font-weight:700;cursor:pointer;}
.keypad button:active{background:var(--gray-bg);}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);}
:root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--card);color:var(--text);border:1px solid var(--border);}}
:root[data-theme="dark"] .toast{background:var(--card);color:var(--text);border:1px solid var(--border);}

.emptystate{text-align:center;padding:50px 20px;color:var(--text-2);}
.emptystate .icon-lg{margin:0 auto 10px;color:var(--text-2);}

.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.legend{display:flex;flex-direction:column;gap:8px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:none;}

.copybox{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow-y:auto;}

.tabs{display:flex;gap:6px;background:var(--gray-bg);padding:4px;border-radius:11px;width:fit-content;}
.tab{padding:7px 13px;border-radius:8px;border:none;background:transparent;font-weight:700;font-size:12.5px;color:var(--text-2);cursor:pointer;}
.tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow);}

.textarea-list{min-height:64px;}
.formgrid{display:flex;flex-direction:column;gap:12px;}

@media (max-width:860px){
  .sidebar{display:none;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .view{padding:2px 14px 96px;}
  .topbar{padding:14px 14px 8px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;
  }
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-2);font-size:10.5px;font-weight:700;padding:4px 8px;cursor:pointer;flex:1;}
  .bn-item.active{color:var(--primary);}
  .bracket-row{grid-auto-columns:minmax(64px,1fr);}
}
@media (min-width:861px){
  .st-controls{position:sticky;}
}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------------- icons ---------------- */
var ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',
  clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M9 12l2 2 4-4"/>',
  tag:'<path d="M11 3H4v7l10 10 7-7L11 3z"/><circle cx="7.4" cy="7.4" r="1.1" fill="currentColor" stroke="none"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  clock:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 2"/>',
  bars:'<path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12c0-.4 0-.8-.1-1.2l1.9-1.5-2-3.4-2.2.9c-.6-.5-1.3-.9-2-1.2L14.2 3H9.8l-.4 2.6c-.7.3-1.4.7-2 1.2l-2.2-.9-2 3.4L5.1 11c-.1.4-.1.8-.1 1.2s0 .8.1 1.2l-1.9 1.6 2 3.4 2.2-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.2.9 2-3.4-1.9-1.6c.1-.4.1-.8.1-1.2z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>',
  check:'<path d="M5 13l4 4 10-10"/>',
  minus:'<path d="M5 12h14"/>',
  dots:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  trash:'<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>',
  barcode:'<path d="M4 5v14M7.5 5v14M11 5v14M13 5v14M17 5v14M20 5v14"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4 20c0-4.2 4-6.4 8-6.4s8 2.2 8 6.4"/>',
  warehouse:'<path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
  save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4"/><path d="M8 21v-6h8v6"/>'
};
function icon(name,extraClass){ return '<svg class="icon '+(extraClass||'')+'" viewBox="0 0 24 24">'+ (ICONS[name]||'') +'</svg>'; }

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtNum(n){ n = Number(n)||0; return n.toLocaleString('en-US'); }
function fmtMoney(n){ n = Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pad2(n){ return n<10?'0'+n:''+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(iso){ if(!iso) return '—'; var p=iso.split('-'); if(p.length<3) return iso; var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return p[2]+' '+months[parseInt(p[1],10)-1]+' '+p[0]; }
function fmtTime(ts){ if(!ts) return ''; var d=new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function slug(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]+/g,''); }
function debounce(fn,ms){ var t; return function(){ var a=arguments; clearTimeout(t); t=setTimeout(function(){fn.apply(null,a);},ms); }; }
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.hidden = true; }, 2200);
}

/* ---------------- default config ---------------- */
/* Palette drawn from VHM's own stock sheet (the real color vocabulary
   used across its code blocks), ordered by how often each appears. */
var DEFAULT_COLORS = [
  {code:'blk', name:'ខ្មៅ (Black)', hex:'#1D1D1F'},
  {code:'wht', name:'សរ (White)', hex:'#F2F1EA'},
  {code:'gry', name:'ប្រផេះ (Grey)', hex:'#8B93A1'},
  {code:'nud', name:'សាច់ដី (Nude)', hex:'#D8B594'},
  {code:'ink', name:'ប៊ិច (Ink Blue)', hex:'#26344A'},
  {code:'sky', name:'មេឃ (Sky Blue)', hex:'#6FA8D8'},
  {code:'grn', name:'បៃតង (Green)', hex:'#2F6B45'},
  {code:'olv', name:'ស្លែ (Olive)', hex:'#6B7A4A'},
  {code:'cof', name:'កាហ្វេ (Coffee)', hex:'#6B4A2F'},
  {code:'slv', name:'ប្រាក់ (Silver)', hex:'#B9BEC6'},
  {code:'ylw', name:'លឿង (Yellow)', hex:'#C99A2E'},
  {code:'mrn', name:'ឈាមជ្រូក (Maroon)', hex:'#6E2A2A'},
  {code:'red', name:'ក្រហម (Red)', hex:'#A93636'},
  {code:'pnk', name:'ឈូក (Pink)', hex:'#D98BA6'},
  {code:'blu', name:'ខៀវ (Blue)', hex:'#24405F'},

/* ---------------- local fallback store (mimics db capability subset) ---------------- */
function makeLocalDB(){
  var LSKEY = 'vhm_stocktake_v1';
  function loadAll(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch(e){ return {}; } }
  function saveAll(d){ try{ localStorage.setItem(LSKEY, JSON.stringify(d)); }catch(e){} }
  var bus = {};
  function emit(colPath){
    var all = loadAll();
    (bus[colPath]||[]).forEach(function(fn){
      var items = Object.keys(all[colPath]||{}).map(function(id){ return {id:id, exists:true, data:function(){return all[colPath][id];}}; });
      fn({ docs: items, size: items.length, empty: items.length===0, docChanges:function(){return [];} });
    });
    var docBus = bus['doc:'+colPath];
  }
  function docRef(path){
    var parts = path.split('/'); var id = parts.pop(); var colPath = parts.join('/');
    return {
      id:id, path:path,
      get: function(){ var all=loadAll(); var d=(all[colPath]||{})[id]; return Promise.resolve({id:id, exists: d!==undefined, data:function(){return d;}}); },
      set: function(data){ var all=loadAll(); all[colPath]=all[colPath]||{}; all[colPath][id]=JSON.parse(JSON.stringify(data)); saveAll(all); emit(colPath); (bus['doc:'+path]||[]).forEach(function(fn){fn({id:id,exists:true,data:function(){return all[colPath][id];}});}); return Promise.resolve(); },
      update: function(data){ var all=loadAll(); all[colPath]=all[colPath]||{}; var cur=all[colPath][id]||{}; var merged=Object.assign({},cur,data); all[colPath][id]=merged; saveAll(all); emit(colPath); (bus['doc:'+path]||[]).forEach(function(fn){fn({id:id,exists:true,data:function(){return merged;}});}); return Promise.resolve(); },
      delete: function(){ var all=loadAll(); if(all[colPath]) delete all[colPath][id]; saveAll(all); emit(colPath); return Promise.resolve(); },
      onSnapshot: function(next){ var all=loadAll(); var d=(all[colPath]||{})[id]; next({id:id, exists:d!==undefined, data:function(){return d;}}); bus['doc:'+path]=bus['doc:'+path]||[]; bus['doc:'+path].push(next); return function(){ var i=bus['doc:'+path].indexOf(next); if(i>-1) bus['doc:'+path].splice(i,1); }; },
      collection: function(sub){ return collRef(path+'/'+sub); }
    };
  }
  function collRef(path){
    var q = { _filters:[] };
    function build(extra){ var nq={_filters:q._filters.slice()}; Object.assign(nq,extra); return wrap(nq); }
    function wrap(qq){
      return {
        path:path,
        doc: function(id){ return docRef(path+'/'+(id||uid('d'))); },
        add: function(data){ var r=docRef(path+'/'+uid('d')); return r.set(data).then(function(){return r;}); },
        where: function(f,op,v){ return build({_filters:(qq._filters||[]).concat([{f:f,op:op,v:v}])}); },
        orderBy: function(f,dir){ return Object.assign(build({}), {_orderBy:f,_dir:dir||'asc'}); },
        limit: function(n){ return Object.assign(build({}), {_limit:n}); },
        get: function(){
          var all=loadAll(); var raw = all[path]||{};
          var docs = Object.keys(raw).map(function(id){ return {id:id, exists:true, data:function(){return raw[id];}}; });
          (qq._filters||[]).forEach(function(fl){
            docs = docs.filter(function(d){
              var val = d.data()[fl.f];
              if(fl.op==='==') return val===fl.v;
              if(fl.op==='!=') return val!==fl.v;
              if(fl.op==='in') return (fl.v||[]).indexOf(val)>-1;
              return true;
            });
          });
          if(qq._orderBy){ docs.sort(function(a,b){ var av=a.data()[qq._orderBy],bv=b.data()[qq._orderBy]; if(av<bv) return qq._dir==='desc'?1:-1; if(av>bv) return qq._dir==='desc'?-1:1; return 0; }); }
          if(qq._limit) docs = docs.slice(0,qq._limit);
          return Promise.resolve({docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}});
        },
        onSnapshot: function(next){
          var fn = function(){ wrap(qq).get().then(next); };
          fn();
          bus[path]=bus[path]||[]; bus[path].push(fn);
          return function(){ var i=bus[path].indexOf(fn); if(i>-1) bus[path].splice(i,1); };
        }
      };
    }
    return wrap(q);
  }
  return { doc:docRef, collection:collRef, __local:true };
}

function colorMeta(code){
  var c = state.settings.colors.find(function(x){return x.code===code;});
  return c || {code:code,name:code,hex:'#999'};
}
function catMeta(key){ return state.settings.categories[key] || {label:key,codePrefix:'',subcats:[],sizes:[]}; }

/* ---------------- derived data ---------------- */
function productsForCode(code){ return state.products.filter(function(p){return p.code===code;}); }
function allCodes(){
  var seen={}, list=[];
  state.products.forEach(function(p){ if(!seen[p.code]){ seen[p.code]=1; list.push(p.code); } });
  return list;
}
function codeInfo(code){
  var variants = productsForCode(code);
  var first = variants[0] || {};
  return { code:code, name:first.name||code, category:first.category||'shirts', subcategory:first.subcategory||'', variants:variants };
}
function itemsForStocktake(stId){ return state.items.filter(function(i){ return i.stocktake_id===stId; }); }
function itemFor(stId,productId){ return state.items.find(function(i){ return i.stocktake_id===stId && i.product_id===productId; }); }

function computeStatus(sys,phys){
  if(phys===null||phys===undefined) return 'NOT COUNTED';
  var d = phys-sys;
  if(d===0) return 'MATCH';
  if(d<0) return 'SHORT';
  return 'EXTRA';
}
function statusClass(st){ return st==='MATCH'?'match':st==='SHORT'?'short':st==='EXTRA'?'extra':'none'; }
function statusBadge(st){
  var cls = st==='MATCH'?'badge-match':st==='SHORT'?'badge-short':st==='EXTRA'?'badge-extra':'badge-none';
  return '<span class="badge '+cls+'">'+st+'</span>';
}

function activeStocktake(){ return state.stocktakes.find(function(s){return s.id===state.ui.activeStocktakeId;}); }

function recomputeStocktakeTotals(stId){
  var items = itemsForStocktake(stId);
  var counted=0, short=0, extra=0, match=0, shortQty=0, extraQty=0;
  items.forEach(function(it){
    if(it.status!=='NOT COUNTED'){ counted++; }
    if(it.status==='SHORT'){ short++; shortQty += (it.system_quantity-it.physical_quantity); }
    if(it.status==='EXTRA'){ extra++; extraQty += (it.physical_quantity-it.system_quantity); }
    if(it.status==='MATCH'){ match++; }
  });
  var totalVariants = 0;
  var st = state.stocktakes.find(function(s){return s.id===stId;});
  if(st){
    var vs = state.products.filter(function(p){ return st.category==='all' ? true : p.category===st.category; });
    totalVariants = vs.length;
  }
  return { totalProducts:totalVariants, counted:counted, notCounted:Math.max(totalVariants-counted,0), match:match, short:short, extra:extra, shortQty:shortQty, extraQty:extraQty };
}

/* ---------------- KPIs ---------------- */
function computeKPIs(){
  var totalProducts = state.products.length;
  var totalQty = state.products.reduce(function(a,p){return a+(p.system_quantity||0);},0);
  var totalValue = state.products.reduce(function(a,p){return a+(p.system_quantity||0)*(p.unit_cost||0);},0);
  var today = todayISO();
  var itemsToday = state.items.filter(function(i){ return (i.counted_at||'').slice(0,10)===today; });
  var countedTodayProducts = {}; itemsToday.forEach(function(i){countedTodayProducts[i.product_id]=1;});
  var countedToday = Object.keys(countedTodayProducts).length;
  var discrepancies = state.items.filter(function(i){ return i.status==='SHORT'||i.status==='EXTRA'; });
  var discToday = itemsToday.filter(function(i){return i.status==='SHORT'||i.status==='EXTRA';}).length;
  var lowStock = state.products.filter(function(p){ return (p.system_quantity||0)>0 && (p.system_quantity||0)<=3; }).length;
  var outStock = state.products.filter(function(p){ return (p.system_quantity||0)<=0; }).length;
  var completed = state.stocktakes.filter(function(s){return s.status==='completed';}).sort(function(a,b){return (b.completed_at||0)-(a.completed_at||0);});
  var lastDate = completed.length ? completed[0].date : null;
  return { totalProducts:totalProducts, totalQty:totalQty, totalValue:totalValue, countedToday:countedToday, discrepancies:discrepancies.length, discToday:discToday, lowStock:lowStock, outStock:outStock, lastDate:lastDate };
}

function categoryStats(rangeItems){
  var cats = Object.keys(state.settings.categories);
  return cats.map(function(k){
    var its = rangeItems.filter(function(i){return i.category===k;});
    var counted = its.filter(function(i){return i.status!=='NOT COUNTED';}).length;
    var short = its.filter(function(i){return i.status==='SHORT';}).length;
    var extra = its.filter(function(i){return i.status==='EXTRA';}).length;
    var match = its.filter(function(i){return i.status==='MATCH';}).length;
    var value = state.products.filter(function(p){return p.category===k;}).reduce(function(a,p){return a+(p.system_quantity||0)*(p.unit_cost||0);},0);
    return {key:k, label:catMeta(k).label, counted:counted, short:short, extra:extra, match:match, value:value};
  });
}

function rangeStart(rangeKey, custom){
  var now = new Date();
  if(rangeKey==='today'){ return todayISO(); }
  if(rangeKey==='week'){ var d=new Date(now); d.setDate(d.getDate()-6); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  if(rangeKey==='month'){ var d2=new Date(now); d2.setDate(d2.getDate()-29); return d2.getFullYear()+'-'+pad2(d2.getMonth()+1)+'-'+pad2(d2.getDate()); }
  if(rangeKey==='custom' && custom) return custom;
  return '2000-01-01';
}
function itemsInRange(rangeKey,custom){
  var start = rangeStart(rangeKey,custom);
  return state.items.filter(function(i){ return (i.counted_at||'').slice(0,10) >= start; });
}

/* ---------------- Firestore adapter ----------------
   Wraps the Firebase v9 modular SDK behind the exact same
   {doc(path), collection(path)} interface as makeLocalDB(), so every
   render/event-handler function above works unmodified whether the
   page is backed by Firestore or the local fallback. */
function makeFirebaseDB(fsdb, mod){
  function wrapDocSnap(snap){ return { id:snap.id, exists:snap.exists(), data:function(){ return snap.data(); } }; }
  function wrapQuerySnap(qs){
    var docs = qs.docs.map(function(d){ return { id:d.id, exists:true, data:function(){ return d.data(); } }; });
    return { docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){ return []; } };
  }
  function docRefFromNative(ref){
    return {
      id: ref.id, path: ref.path,
      get: function(){ return mod.getDoc(ref).then(wrapDocSnap); },
      set: function(data){ return mod.setDoc(ref, data); },
      update: function(data){ return mod.updateDoc(ref, data); },
      delete: function(){ return mod.deleteDoc(ref); },
      onSnapshot: function(next, error){ return mod.onSnapshot(ref, function(snap){ next(wrapDocSnap(snap)); }, error); },
      collection: function(sub){ return collRef(ref.path+'/'+sub, []); }
    };
  }
  function collRef(path, constraints){
    constraints = constraints || [];
    var colRef = mod.collection(fsdb, path);
    function buildQuery(){ return constraints.length ? mod.query.apply(null, [colRef].concat(constraints)) : colRef; }
    return {
      path: path,
      doc: function(id){ var ref = id ? mod.doc(fsdb, path+'/'+id) : mod.doc(colRef); return docRefFromNative(ref); },
      add: function(data){ return mod.addDoc(colRef, data).then(docRefFromNative); },
      where: function(f,op,v){ return collRef(path, constraints.concat([mod.where(f,op,v)])); },
      orderBy: function(f,dir){ return collRef(path, constraints.concat([mod.orderBy(f, dir||'asc')])); },
      limit: function(n){ return collRef(path, constraints.concat([mod.limit(n)])); },
      get: function(){ return mod.getDocs(buildQuery()).then(wrapQuerySnap); },
      onSnapshot: function(next, error){ return mod.onSnapshot(buildQuery(), function(qs){ next(wrapQuerySnap(qs)); }, error); }
    };
  }
  return { doc: function(path){ return docRefFromNative(mod.doc(fsdb, path)); }, collection: function(path){ return collRef(path, []); } };
}
window.__vhmMakeFirebaseAdapter = makeFirebaseDB;

/* ---------------- storage / sync ---------------- */
var unsub = [];
var booted = false;
function bootWithDb(db, online){
  if(booted) return; booted = true;
  state.db = db || makeLocalDB();
  state.online = !!online;
  renderShell();
  ensureSeed().then(subscribeAll).catch(function(err){
    // Firestore reachable but rejecting calls (rules not published yet,
    // wrong project, offline mid-boot) — don't leave the page stuck on a
    // blank shell. Drop to on-device storage so it's still usable, and
    // say why in Settings rather than failing silently.
    console.error('VHM Stock Take: Firestore calls failed, falling back to on-device storage.', err);
    booted = false;
    bootWithDb(null, false);
  });
}
window.__vhmBoot = bootWithDb;
// Safety net: if the Firebase module script below never calls back
// (blocked network, ad blocker, offline), fall back to on-device storage
// after a few seconds rather than leaving the page stuck loading.
setTimeout(function(){ bootWithDb(null, false); }, 6000);

function ensureSeed(){
  var settingsRef = state.db.collection('vhm_stocktake_meta').doc('settings');
  return settingsRef.get().then(function(snap){
    if(snap.exists){
      var d = snap.data();
      state.settings = {
        categories: d.categories || DEFAULT_CATEGORIES,
        colors: d.colors || DEFAULT_COLORS,
        staff: d.staff || DEFAULT_STAFF,
        warehouses: d.warehouses || DEFAULT_WAREHOUSES
      };
      state.ui.staff = state.settings.staff[0];
      state.ui.warehouse = state.settings.warehouses[0];
      return checkSeedProducts();
    } else {
      return settingsRef.set({categories:DEFAULT_CATEGORIES, colors:DEFAULT_COLORS, staff:DEFAULT_STAFF, warehouses:DEFAULT_WAREHOUSES}).then(function(){
        return seedProducts();
      });
    }
  });
}
function checkSeedProducts(){
  return state.db.collection('vhm_stocktake_products').limit(1).get().then(function(qs){
    if(qs.empty) return seedProducts();
  });
}
function seedProducts(){
  var seedCodes = [
    {code:'E205', name:'Overshirt E205', category:'shirts', subcategory:'Overshirt', cost:8, price:19, colors:['wht','blk','khk'], sizes:['S','M','L','XL','2XL']},
    {code:'E292', name:'Slim Polo E292', category:'shirts', subcategory:'Polo', cost:5, price:13, colors:['blk','ink','gry','wht'], sizes:['S','M','L','XL','2XL','3XL']},
    {code:'V220', name:'Straight Jeans V220', category:'pants', subcategory:'Jeans', cost:9, price:22, colors:['blk','ink'], sizes:['28','30','32','34','36','38']},
    {code:'V310', name:'Cargo Jogger V310', category:'pants', subcategory:'Jogger', cost:7, price:17, colors:['khk','blk','gry'], sizes:['30','32','34','36']},
    {code:'T050', name:'Leather Belt T050', category:'accessories', subcategory:'Belt', cost:3, price:8, colors:['blk','cof'], sizes:['Free Size']},
    {code:'T012', name:'Snapback Cap T012', category:'accessories', subcategory:'Cap', cost:2.5, price:7, colors:['blk','wht','red'], sizes:['Free Size']}
  ];
  var ops = [];
  var col = state.db.collection('vhm_stocktake_products');
  seedCodes.forEach(function(sc){
    sc.colors.forEach(function(cc){
      sc.sizes.forEach(function(sz){
        var id = sc.code+'_'+slug(sz)+'_'+cc;
        var qty = 4 + Math.floor(Math.random()*14);
        ops.push(col.doc(id).set({
          code:sc.code, name:sc.name, category:sc.category, subcategory:sc.subcategory,
          color:cc, size:sz, location:'Rack '+sc.code.slice(0,1), barcode:id.toUpperCase(),
          system_quantity:qty, unit_cost:sc.cost, selling_price:sc.price,
          created_at: Date.now(), updated_at: Date.now()
        }));
      });
    });
  });
  return ops.reduce(function(p,op){ return p.then(function(){return op;}); }, Promise.resolve());
}

function subscribeAll(){
  unsub.forEach(function(u){ try{u();}catch(e){} });
  unsub = [];
  unsub.push(state.db.collection('vhm_stocktake_products').onSnapshot(function(qs){
    state.products = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    scheduleRender();
  }, function(){}));
  unsub.push(state.db.collection('vhm_stocktake_stocktakes').orderBy('created_at','desc').limit(200).onSnapshot(function(qs){
    state.stocktakes = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(!state.ui.activeStocktakeId){
      var draft = state.stocktakes.find(function(s){return s.status==='in_progress';});
      if(draft) state.ui.activeStocktakeId = draft.id;
    }
    scheduleRender();
  }, function(){}));
  unsub.push(state.db.collection('vhm_stocktake_items').limit(2000).onSnapshot(function(qs){
    state.items = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    scheduleRender();
  }, function(){}));
  scheduleRender();
}

/* ---------------- writes ---------------- */
function saveItem(stId, product, physicalQty, staff){
  var status = computeStatus(product.system_quantity, physicalQty);
  var id = stId+'__'+product.id;
  var payload = {
    stocktake_id: stId, product_id: product.id, code: product.code, name:product.name,
    size: product.size, color: product.color, category: product.category,
    system_quantity: product.system_quantity, physical_quantity: physicalQty,
    difference: physicalQty - product.system_quantity, status: status,
    counted_at: new Date().toISOString(), counted_by: staff
  };
  // optimistic local update
  var idx = state.items.findIndex(function(i){return i.id===id;});
  if(idx>-1) state.items[idx] = Object.assign({id:id},payload); else state.items.push(Object.assign({id:id},payload));
  state.ui.lastSaved = Date.now();
  return state.db.collection('vhm_stocktake_items').doc(id).set(payload).then(function(){
    return refreshStocktakeTotals(stId);
  });
}
function refreshStocktakeTotals(stId){
  var totals = recomputeStocktakeTotals(stId);
  var idx = state.stocktakes.findIndex(function(s){return s.id===stId;});
  if(idx>-1) state.stocktakes[idx] = Object.assign({}, state.stocktakes[idx], {totals:totals});
  return state.db.collection('vhm_stocktake_stocktakes').doc(stId).update({totals:totals}).catch(function(){});
}
function startStocktake(category){
  var today = todayISO();
  var seq = state.stocktakes.filter(function(s){return s.date===today;}).length + 1;
  var num = 'ST-'+today.replace(/-/g,'')+'-'+pad2(seq);
  var payload = {
    number:num, date:today, staff:state.ui.staff, warehouse:state.ui.warehouse, category:category||'all',
    status:'in_progress', created_at: Date.now(), completed_at:null,
    totals:{totalProducts:0,counted:0,notCounted:0,match:0,short:0,extra:0,shortQty:0,extraQty:0}
  };
  return state.db.collection('vhm_stocktake_stocktakes').add(payload).then(function(ref){
    state.ui.activeStocktakeId = ref.id;
    state.stocktakes.unshift(Object.assign({id:ref.id},payload));
    scheduleRender();
    return ref.id;
  });
}
function completeStocktake(stId){
  return refreshStocktakeTotals(stId).then(function(){
    return state.db.collection('vhm_stocktake_stocktakes').doc(stId).update({status:'completed', completed_at:Date.now()});
  }).then(function(){
    var idx = state.stocktakes.findIndex(function(s){return s.id===stId;});
    if(idx>-1) state.stocktakes[idx] = Object.assign({}, state.stocktakes[idx], {status:'completed', completed_at:Date.now()});
    state.ui.activeStocktakeId = null;
    scheduleRender();
  });
}

/* ---------------- charts (inline svg) ---------------- */
function donutChart(segments, size){
  size = size||150;
  var r = size/2 - 12, c = size/2;
  var total = segments.reduce(function(a,s){return a+s.value;},0) || 1;
  var circ = 2*Math.PI*r;
  var offset = 0;
  var circles = segments.map(function(s){
    var frac = s.value/total;
    var dash = frac*circ;
    var el = '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="16" stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+c+' '+c+')"/>';
    offset += dash;
    return el;
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--gray-bg)" stroke-width="16"/>'+
    circles+
    '<text x="'+c+'" y="'+(c-3)+'" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="22" fill="var(--text)">'+total+'</text>'+
    '<text x="'+c+'" y="'+(c+15)+'" text-anchor="middle" font-size="10.5" fill="var(--text-2)">items</text>'+
  '</svg>';
}

function groupedBarChart(rows, keys, colors, width, height){
  width = width||520; height = height||220;
  var padL=34, padB=26, padT=12, padR=10;
  var innerW = width-padL-padR, innerH = height-padT-padB;
  var max = 1;
  rows.forEach(function(r){ keys.forEach(function(k){ if(r[k]>max) max=r[k]; }); });
  max = Math.ceil(max*1.15) || 1;
  var groupW = innerW/rows.length;
  var barW = Math.min(18, (groupW-14)/keys.length);
  var bars='', labels='', gridlines='';
  var steps=4;
  for(var g=0; g<=steps; g++){
    var val = Math.round(max/steps*g);
    var y = padT+innerH-(val/max)*innerH;
    gridlines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(width-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    gridlines += '<text x="4" y="'+(y+3)+'" font-size="9.5" fill="var(--text-2)">'+val+'</text>';
  }
  rows.forEach(function(r,i){
    var gx = padL + i*groupW + (groupW - barW*keys.length)/2;
    keys.forEach(function(k,ki){
      var v = r[k]||0;
      var h = (v/max)*innerH;
      var x = gx + ki*barW;
      var y = padT+innerH-h;
      bars += '<rect x="'+x+'" y="'+y+'" width="'+(barW-3)+'" height="'+Math.max(h,0)+'" rx="3" fill="'+colors[ki]+'"/>';
    });
    labels += '<text x="'+(padL+i*groupW+groupW/2)+'" y="'+(height-6)+'" text-anchor="middle" font-size="10.5" fill="var(--text-2)">'+esc(r.label)+'</text>';
  });
  return '<svg width="100%" viewBox="0 0 '+width+' '+height+'" style="max-width:'+width+'px">'+gridlines+bars+labels+'</svg>';
}

function sparkLine(values, width, height){
  width=width||520; height=height||120;
  var padL=30,padR=10,padT=14,padB=20;
  var innerW=width-padL-padR, innerH=height-padT-padB;
  var max = Math.max.apply(null, values.concat([1]));
  var min = Math.min.apply(null, values.concat([0]));
  if(max===min) max=min+1;
  var pts = values.map(function(v,i){
    var x = padL + (values.length===1?0:(i/(values.length-1))*innerW);
    var y = padT + innerH - ((v-min)/(max-min))*innerH;
    return [x,y];
  });
  var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area = path + ' L'+pts[pts.length-1][0].toFixed(1)+' '+(padT+innerH)+' L'+pts[0][0].toFixed(1)+' '+(padT+innerH)+' Z';
  var dots = pts.map(function(p,i){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.4)+'" fill="var(--primary)"/>'; }).join('');
  return '<svg width="100%" viewBox="0 0 '+width+' '+height+'" style="max-width:'+width+'px">'+
    '<path d="'+area+'" fill="var(--primary-tint)" stroke="none"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--primary)" stroke-width="2.4"/>'+
    dots+
  '</svg>';
}

  return '<div class="card codecard" data-open-code="'+esc(code)+'">'+
    '<div class="cc-main">'+
      '<b>'+esc(code)+' · '+esc(info.name)+'</b>'+

}
function uniqueColors(variants){ var seen={}, list=[]; variants.forEach(function(v){ if(!seen[v.color]){seen[v.color]=1;list.push(v.color);} }); return list; }
function uniqueSizes(variants){ var seen={}, list=[]; variants.forEach(function(v){ if(!seen[v.size]){seen[v.size]=1;list.push(v.size);} }); return list; }

function renderBracketModal(code, st){
  var info = codeInfo(code);
  var variants = info.variants;
  var sizes = uniqueSizes(variants);
  var colors = uniqueColors(variants);
  var sizeOrder = catMeta(info.category).sizes;
  sizes.sort(function(a,b){ return sizeOrder.indexOf(a)-sizeOrder.indexOf(b); });

  var head = '<div class="bracket-head" style="grid-template-columns:60px repeat('+colors.length+',1fr);display:grid;gap:8px;">'+
    '<div></div>'+ colors.map(function(cc){ var cm=colorMeta(cc); return '<div style="text-align:center;"><span class="swatch" style="background:'+cm.hex+'"></span></div>'; }).join('') +
  '</div>';

  var rows = sizes.map(function(sz){
    var cells = colors.map(function(cc){
      var v = variants.find(function(x){return x.size===sz && x.color===cc;});
      if(!v) return '<div></div>';
      var it = itemFor(st.id, v.id);

        '<div class="bc-qty num">'+(phys===null?'–':phys)+'</div>'+

    return '<div style="display:grid;grid-template-columns:60px repeat('+colors.length+',1fr);gap:8px;align-items:center;">'+
      '<div style="font-weight:800;font-size:12.5px;">'+esc(sz)+'</div>'+cells+

  }).join('');

  var colorLegend = colors.map(function(cc){ var cm=colorMeta(cc); return '<div class="chip"><span class="swatch" style="background:'+cm.hex+'"></span>'+esc(cm.name)+'</div>'; }).join('');

  return '<div class="modal-backdrop" id="bracket-backdrop">'+
    '<div class="modal-sheet" style="max-width:560px;">'+
      '<div class="modal-head"><h3>'+esc(code)+' · '+esc(info.name)+'</h3><button class="iconbtn" id="close-bracket">'+icon('x','icon-sm')+'</button></div>'+

function nextUncountedInGrid(code, currentProductId, stId){
  var info = codeInfo(code);
  var variants = info.variants;
  var idx = variants.findIndex(function(v){return v.id===currentProductId;});
  for(var i=1;i<=variants.length;i++){
    var v = variants[(idx+i)%variants.length];
    var it = itemFor(stId, v.id);
    if(!it || it.status==null){ return v; }
  }
  // fallback: first not-counted by our own status flag
  for(var j=0;j<variants.length;j++){
    var vv = variants[j];
    var itemv = itemFor(stId, vv.id);
    if(!itemv) return vv;
  }
  return null;
}

      kpi('Short', fmtNum(t.shortQty||0)+' pcs', (t.short||0)+' SKUs')+

  var accuracy = completed.map(function(s){ var t=s.totals||{}; var c=t.counted||1; return Math.round(((t.match||0)/c)*100); });

  '<div class="grid two-col">'+
    '<div class="card pad"><div style="font-weight:800;font-size:13px;margin-bottom:6px;">Counted / short / extra by category</div>'+

      legendRow([['Counted','var(--primary)'],['Short','var(--danger)'],['Extra','var(--warning)']])+
    '</div>'+
    '<div class="card pad"><div style="font-weight:800;font-size:13px;margin-bottom:6px;">Stock value by category</div>'+
      groupedBarChart(valueRows,['Value'],['var(--primary)'])+
      '<div style="color:var(--text-2);font-size:11.5px;margin-top:6px;">Current on-hand value at unit cost, in USD</div>'+
    '</div>'+
  '</div>'+
  '<div class="section-title"><h2>Stock take accuracy trend</h2><span class="hint">last '+completed.length+' completed counts</span></div>'+
  '<div class="card pad">'+ (accuracy.length ? sparkLine(accuracy) : '<div style="color:var(--text-2);font-size:12.5px;">Complete a stock take to see accuracy over time.</div>') +'</div>'+

  '<div class="card pad">'+
    (topMismatch.length ? topMismatch.map(function(m){

      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'+

/* ---------------- clipboard helper ---------------- */
function copyText(text){
  try{
    navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard'); }, function(){ fallbackCopy(text); });
  }catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('Copied to clipboard');
  }catch(e){ toast('Could not copy — select the text manually'); }
}

function buildStocktakeSummaryText(stId){
  var s = state.stocktakes.find(function(x){return x.id===stId;});
  var items = itemsForStocktake(stId).filter(function(i){return i.status!=='NOT COUNTED';});
  var byCode = {};
  items.forEach(function(i){ (byCode[i.code]=byCode[i.code]||[]).push(i); });
  var lines = ['VHM Stock Take '+ (s?s.number:stId), s?(fmtDate(s.date)+' · '+s.warehouse+' · '+s.staff):'', ''];
  Object.keys(byCode).sort().forEach(function(code){
    lines.push(code+':');
    byCode[code].sort(function(a,b){return a.size.localeCompare(b.size);}).forEach(function(i){
      lines.push('  '+i.size+' '+colorMeta(i.color).name+' = '+i.physical_quantity+' (sys '+i.system_quantity+(i.difference!==0?(', '+(i.difference>0?'+':'')+i.difference):'')+')');
    });
  });
  return lines.join('\n');
}

/* ---------------- event delegation ---------------- */
document.addEventListener('click', function(e){
  var t = e.target;
  var goBtn = t.closest('[data-go]'); if(goBtn){ go(goBtn.getAttribute('data-go')); return; }
  var bn = t.closest('[data-bn]'); if(bn){ var k=bn.getAttribute('data-bn'); if(k==='more'){ state.ui.moreOpen=true; syncModals(); } else { go(k); } return; }

  if(t.closest('#close-more')){ state.ui.moreOpen=false; syncModals(); return; }
  if(t.id==='more-backdrop'){ state.ui.moreOpen=false; syncModals(); return; }

  // Stock take: start
  if(t.closest('#btn-start-st')){
    var staffSel=document.getElementById('in-staff'), whSel=document.getElementById('in-wh'), catSel=document.getElementById('in-cat');
    state.ui.staff = staffSel.value; state.ui.warehouse = whSel.value;
    startStocktake(catSel.value);
    return;
  }
  var openCode = t.closest('[data-open-code]'); if(openCode){ state.ui.openCode = openCode.getAttribute('data-open-code'); renderPage(); return; }
  if(t.closest('#close-bracket') || t.closest('#close-bracket-2')){ state.ui.openCode=null; renderPage(); return; }
  if(t.id==='bracket-backdrop'){ state.ui.openCode=null; renderPage(); return; }
  var cellBtn = t.closest('[data-cell-product]'); if(cellBtn){ openCellModal(cellBtn.getAttribute('data-cell-product')); return; }

  var catTab = t.closest('[data-cat-tab]'); if(catTab){
    var st = activeStocktake(); if(st){ st.category = catTab.getAttribute('data-cat-tab'); state.db.collection('vhm_stocktake_stocktakes').doc(st.id).update({category:st.category}).catch(function(){}); renderPage(); }
    return;
  }

  if(t.closest('#btn-newcode') || t.closest('#btn-newcode2')){ openNewCodeModal(); return; }
  if(t.closest('#close-newcode') || t.id==='newcode-backdrop'){ newCodeCtx=null; renderModalRoot2(); return; }
  var toggleColor = t.closest('[data-toggle-color]'); if(toggleColor && newCodeCtx){
    var cc = toggleColor.getAttribute('data-toggle-color');
    var i = newCodeCtx.colors.indexOf(cc);
    if(i>-1) newCodeCtx.colors.splice(i,1); else newCodeCtx.colors.push(cc);
    renderModalRoot2(); return;
  }
  var toggleSize = t.closest('[data-toggle-size]'); if(toggleSize && newCodeCtx){
    var sz = toggleSize.getAttribute('data-toggle-size');
    var si = newCodeCtx.sizes.indexOf(sz);
    if(si>-1) newCodeCtx.sizes.splice(si,1); else newCodeCtx.sizes.push(sz);
    renderModalRoot2(); return;
  }
  if(t.closest('#nc-create')){ submitNewCode(); return; }

  if(t.closest('#btn-save-progress')){ var st2=activeStocktake(); if(st2){ refreshStocktakeTotals(st2.id).then(function(){ state.ui.lastSaved=Date.now(); toast('Progress saved'); renderPage(); }); } return; }
  if(t.closest('#btn-complete-st')){
    var st3 = activeStocktake();
    if(st3){ openConfirmModal('Complete this stock take?', 'This creates a permanent dated record. You can still view it in History afterwards.', function(){ completeStocktake(st3.id).then(function(){ toast('Stock take completed'); go('history'); state.ui.viewStId = st3.id; renderPage(); }); }); }
    return;
  }
  if(t.closest('#btn-export-st')){ var st4=activeStocktake(); if(st4) openExportModal(st4.id); return; }
  if(t.closest('#close-export')||t.id==='export-backdrop'){ document.getElementById('modalRoot').innerHTML=''; return; }
  if(t.closest('#copy-export-text')){ var txt = document.getElementById('export-text'); if(txt) copyText(txt.textContent); return; }
  if(t.closest('#download-export-text')){
    var s7 = state.stocktakes.find(function(x){return x.id===lastExportStId;});
    var fname = (s7?s7.number:'vhm-stocktake') + '.txt';
    var txt2 = document.getElementById('export-text');
    if(txt2) downloadText(fname, txt2.textContent);
    return;
  }
  if(t.closest('#copy-report')){ if(state.ui.viewStId) copyText(buildStocktakeSummaryText(state.ui.viewStId)); return; }

  // qty modal
  if(t.closest('#close-qty') || t.id==='qty-backdrop'){ closeCellModal(); return; }
  var stepBtn = t.closest('[data-step]'); if(stepBtn && qtyModalCtx){ qtyModalCtx.value = Math.max(0, qtyModalCtx.value + parseInt(stepBtn.getAttribute('data-step'),10)); renderModalRoot(); return; }
  var keyBtn = t.closest('[data-key]'); if(keyBtn && qtyModalCtx){
    var k = keyBtn.getAttribute('data-key');
    var cur = String(qtyModalCtx.value);
    if(k==='clear'){ qtyModalCtx.value = 0; }
    else if(k==='back'){ cur = cur.slice(0,-1); qtyModalCtx.value = cur===''?0:parseInt(cur,10); }
    else { cur = (cur==='0'?'':cur)+k; qtyModalCtx.value = parseInt(cur,10)||0; }
    renderModalRoot(); return;
  }
  if(t.closest('#qty-save-close')){
    var st5 = activeStocktake();
    saveItem(st5.id, qtyModalCtx.product, qtyModalCtx.value, state.ui.staff).then(function(){ toast('Saved'); closeCellModal(); renderPage(); });
    return;
  }
  if(t.closest('#qty-save-next')){
    var st6 = activeStocktake();
    var prod = qtyModalCtx.product, code = prod.code, val = qtyModalCtx.value;
    saveItem(st6.id, prod, val, state.ui.staff).then(function(){
      var nxt = nextUncountedInGrid(code, prod.id, st6.id);
      if(nxt){
        qtyModalCtx = { product:nxt, value: (function(){ var it=itemFor(st6.id,nxt.id); return it?it.physical_quantity:nxt.system_quantity; })() };
        renderPage(); renderModalRoot();
      } else {
        toast('All variants counted for '+code); closeCellModal(); renderPage();
      }
    });
    return;
  }

  // products
  var viewCodeRow = t.closest('[data-view-code]'); if(viewCodeRow){ state.ui.viewCode = viewCodeRow.getAttribute('data-view-code'); renderPage(); return; }
  if(t.closest('#close-detail') || t.id==='detail-backdrop'){ state.ui.viewCode=null; editVariantCtx=null; renderPage(); return; }
  var editVarBtn = t.closest('[data-edit-variant]'); if(editVarBtn){ var vid=editVarBtn.getAttribute('data-edit-variant'); editVariantCtx = state.products.find(function(p){return p.id===vid;}); renderPage(); return; }
  if(t.closest('#close-editvariant')){ editVariantCtx=null; renderPage(); return; }
  if(t.closest('#ev-save')){ submitEditVariant(); return; }

  // history
  var viewStRow = t.closest('[data-view-st]'); if(viewStRow){ state.ui.viewStId = viewStRow.getAttribute('data-view-st'); renderPage(); return; }
  if(t.closest('#close-report') || t.id==='report-backdrop'){ state.ui.viewStId=null; renderPage(); return; }

  // categories
  var saveCat = t.closest('[data-save-cat]'); if(saveCat){ submitCategorySave(saveCat.getAttribute('data-save-cat')); return; }
  if(t.closest('#btn-add-color')){ state.settings.colors.push({code:'new'+state.settings.colors.length, name:'New color', hex:'#999999'}); renderPage(); return; }
  var rmColor = t.closest('[data-remove-color]'); if(rmColor){ state.settings.colors.splice(parseInt(rmColor.getAttribute('data-remove-color'),10),1); renderPage(); return; }
  if(t.closest('#btn-save-colors')){ persistSettings(); toast('Palette saved'); return; }

  // settings
  if(t.closest('#btn-save-staff')){ var v1=document.getElementById('set-staff').value; state.settings.staff = v1.split(',').map(function(s){return s.trim();}).filter(Boolean); persistSettings(); toast('Staff list saved'); return; }
  if(t.closest('#btn-save-wh')){ var v2=document.getElementById('set-wh').value; state.settings.warehouses = v2.split(',').map(function(s){return s.trim();}).filter(Boolean); persistSettings(); toast('Warehouses saved'); return; }
  if(t.closest('#btn-reset-demo')){ openConfirmModal('Clear all data?','This permanently deletes every product, stock take and count on this workspace. This cannot be undone.', function(){ resetAllData(); }); return; }

  // confirm modal
  if(t.closest('#confirm-yes')){ if(confirmCtx && confirmCtx.onYes) confirmCtx.onYes(); confirmCtx=null; document.getElementById('modalRoot').innerHTML=''; return; }
  if(t.closest('#confirm-no') || t.id==='confirm-backdrop'){ confirmCtx=null; document.getElementById('modalRoot').innerHTML=''; return; }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='nc-cat' && newCodeCtx){
    var oldPrefix = catMeta(newCodeCtx.category).codePrefix||'';
    newCodeCtx.category = t.value;
    newCodeCtx.sizes = catMeta(t.value).sizes.slice(0,5);
    if(!newCodeCtx.code || newCodeCtx.code===oldPrefix) newCodeCtx.code = catMeta(t.value).codePrefix||'';
    renderModalRoot2(); return;
  }
  if(t.id==='prod-cat'){ state.ui.productsCategory = t.value; renderPage(); return; }
  if(t.id==='set-default-staff'){ state.ui.staff = t.value; return; }
  if(t.id==='set-default-wh'){ state.ui.warehouse = t.value; return; }
  if(t.id==='report-custom-date'){ state.ui.reportCustom = t.value; renderPage(); return; }
});

var debouncedSearch = debounce(function(val){ state.ui.stSearch = val; renderPage(); focusEl('st-search'); }, 180);
var debouncedProdSearch = debounce(function(val){ state.ui.productsSearch = val; renderPage(); focusEl('prod-search'); }, 180);
function focusEl(id){ var el=document.getElementById(id); if(el){ el.focus(); var v=el.value; el.value=''; el.value=v; } }

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='st-search'){ debouncedSearch(t.value); return; }
  if(t.id==='prod-search'){ debouncedProdSearch(t.value); return; }
  if(t.id==='nc-code' && newCodeCtx){ newCodeCtx.code = t.value.toUpperCase(); return; }
  if(t.id==='nc-name' && newCodeCtx){ newCodeCtx.name = t.value; return; }
  if(t.id==='nc-sub' && newCodeCtx){ newCodeCtx.subcategory = t.value; return; }
  if(t.id==='nc-cost' && newCodeCtx){ newCodeCtx.cost = t.value; return; }
  if(t.id==='nc-price' && newCodeCtx){ newCodeCtx.price = t.value; return; }
  var colorField = t.closest('[data-color-field]'); if(colorField){ var idx=parseInt(colorField.getAttribute('data-color-idx'),10); var field2=colorField.getAttribute('data-color-field'); state.settings.colors[idx][field2]=t.value; return; }
});

document.addEventListener('keydown', function(e){
  // barcode-scanner style: fast keystrokes ending with Enter in the stock-take search field
  if(e.key==='Enter' && e.target && e.target.id==='st-search'){
    var val = e.target.value.trim();
    if(val){
      var match = state.products.find(function(p){ return (p.barcode||'').toLowerCase()===val.toLowerCase() || p.code.toLowerCase()===val.toLowerCase(); });
      if(match){ state.ui.openCode = match.code; state.ui.stSearch=''; renderPage(); }
    }
  }
});

/* ---------------- new code / variant edit submit ---------------- */
function submitNewCode(){
  var c = newCodeCtx;
  var code = (document.getElementById('nc-code')||{}).value || c.code;
  code = slug(code);
  if(!code){ toast('Enter a product code'); return; }
  if(state.products.some(function(p){return p.code===code;})){ toast('That code already exists'); return; }
  var name = (document.getElementById('nc-name')||{}).value || c.name || code;
  var sub = (document.getElementById('nc-sub')||{}).value || c.subcategory;
  var cost = parseFloat((document.getElementById('nc-cost')||{}).value || c.cost) || 0;
  var price = parseFloat((document.getElementById('nc-price')||{}).value || c.price) || 0;
  if(!c.sizes.length || !c.colors.length){ toast('Pick at least one size and one color'); return; }
  var col = state.db.collection('vhm_stocktake_products');
  var ops = [];
  c.sizes.forEach(function(sz){
    c.colors.forEach(function(cc){
      var id = code+'_'+slug(sz)+'_'+cc;
      ops.push({id:id, data:{ code:code, name:name, category:c.category, subcategory:sub, color:cc, size:sz, location:'', barcode:id.toUpperCase(), system_quantity:0, unit_cost:cost, selling_price:price, created_at:Date.now(), updated_at:Date.now() }});
    });
  });
  ops.reduce(function(p,op){ return p.then(function(){ return col.doc(op.id).set(op.data); }); }, Promise.resolve()).then(function(){
    toast('Template created: '+ops.length+' variants');
    newCodeCtx=null; state.ui.openCode = code; document.getElementById('modalRoot').innerHTML='';
    if(state.route!=='stocktake') go('products'); else renderPage();
  });
}
function submitEditVariant(){
  var v = editVariantCtx;
  var loc = document.getElementById('ev-location').value;
  var qty = parseFloat(document.getElementById('ev-qty').value)||0;
  var cost = parseFloat(document.getElementById('ev-cost').value)||0;
  var price = parseFloat(document.getElementById('ev-price').value)||0;
  state.db.collection('vhm_stocktake_products').doc(v.id).update({location:loc, system_quantity:qty, unit_cost:cost, selling_price:price, updated_at:Date.now()}).then(function(){
    toast('Product updated'); editVariantCtx=null; renderPage();
  });
}
function submitCategorySave(key){
  var prefixEl = document.querySelector('[data-cat-field="'+key+':codePrefix"]');
  var subEl = document.querySelector('[data-cat-field="'+key+':subcats"]');
  var sizeEl = document.querySelector('[data-cat-field="'+key+':sizes"]');
  state.settings.categories[key].codePrefix = (prefixEl.value||'').trim().toUpperCase();
  state.settings.categories[key].subcats = subEl.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  state.settings.categories[key].sizes = sizeEl.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  persistSettings(); toast('Category saved');
}
function persistSettings(){
  return state.db.collection('vhm_stocktake_meta').doc('settings').set(state.settings).catch(function(){});
}
function resetAllData(){
  var cols = ['vhm_stocktake_products','vhm_stocktake_stocktakes','vhm_stocktake_items'];
  Promise.all(cols.map(function(c){
    return state.db.collection(c).get().then(function(qs){
      return qs.docs.reduce(function(p,d){ return p.then(function(){ return state.db.collection(c).doc(d.id).delete(); }); }, Promise.resolve());
    });
  })).then(function(){
    state.products=[]; state.stocktakes=[]; state.items=[]; state.ui.activeStocktakeId=null;
    return seedProducts();
  }).then(function(){ toast('Data cleared and reseeded'); renderPage(); });
}

/* ---------------- export modal ---------------- */
var lastExportStId = null;
function openExportModal(stId){
  lastExportStId = stId;
  var text = buildStocktakeSummaryText(stId);
  var s = state.stocktakes.find(function(x){return x.id===stId;});
  document.getElementById('modalRoot').innerHTML = '<div class="modal-backdrop" id="export-backdrop"><div class="modal-sheet" style="max-width:480px;">'+
    '<div class="modal-head"><h3>Export stock take</h3><button class="iconbtn" id="close-export">'+icon('x','icon-sm')+'</button></div>'+
    '<div style="color:var(--text-2);font-size:12px;margin-bottom:10px;">Copy this into Telegram/Excel, or download it as a text file to send to Vrich / PokPok.</div>'+
    '<div class="copybox" id="export-text">'+esc(text)+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;">'+
      '<button class="btn btn-block" id="download-export-text">'+icon('save','icon-sm')+' Download .txt</button>'+
      '<button class="btn btn-primary btn-block" id="copy-export-text">'+icon('copy','icon-sm')+' Copy to clipboard</button>'+
    '</div>'+
  '</div></div>';
}
function downloadText(filename, text){
  try{
    var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ toast('Could not download — try Copy instead'); }
}

/* ---------------- confirm modal ---------------- */
var confirmCtx = null;
function openConfirmModal(title, body, onYes){
  confirmCtx = {onYes:onYes};
  document.getElementById('modalRoot').innerHTML = '<div class="modal-backdrop center" id="confirm-backdrop"><div class="modal-sheet" style="max-width:340px;">'+
    '<div class="modal-head"><h3>'+esc(title)+'</h3></div>'+
    '<div style="color:var(--text-2);font-size:12.5px;margin-bottom:16px;">'+esc(body)+'</div>'+
    '<div style="display:flex;gap:8px;"><button class="btn btn-block" id="confirm-no">Cancel</button><button class="btn btn-danger btn-block" id="confirm-yes">Confirm</button></div>'+
  '</div></div>';
}

/* ---------------- boot ----------------
   Initial paint happens immediately (before Firestore connects) so the
   page never sits on a blank screen; bootWithDb() — called by the
   Firebase module script below, or by the safety-net timeout above —
   swaps in real data and starts the live subscriptions. */
var initialRoute = (location.hash||'#dashboard').slice(1);
if(['dashboard','stocktake','products','categories','history','reports','settings'].indexOf(initialRoute)>-1) state.route = initialRoute;
renderShell(); renderPage();

})();
</script>
