// Color-across-the-top, size-down-the-side grid — the same shape as the
// counting bracket and the export image/Excel, so a code reads the same
// way everywhere in the app instead of the flat one-row-per-variant table
// this replaces. Works for every category (pants get their own waist sizes
// via catMeta) without any special-casing here.
function renderProductVariantGrid(code){
  var info = codeInfo(code);
  var variants = info.variants;
  var sizes = uniqueSizes(variants);
  var colors = uniqueColors(variants);
  var sizeOrder = catMeta(info.category).sizes;
  sizes.sort(function(a,b){ return sizeOrder.indexOf(a)-sizeOrder.indexOf(b); });

  var head = '<div style="display:grid;grid-template-columns:60px repeat('+colors.length+',1fr);gap:8px;">'+
    '<div></div>'+ colors.map(function(cc){ var cm=colorMeta(cc); return '<div style="text-align:center;"><span class="swatch" style="background:'+cm.hex+'"></span></div>'; }).join('') +
  '</div>';

  var rows = sizes.map(function(sz){
    var cells = colors.map(function(cc){
      var v = variants.find(function(x){return x.size===sz && x.color===cc;});
      if(!v) return '<div></div>';
      return '<div class="bcell" data-edit-variant="'+v.id+'" title="'+esc(colorMeta(cc).name)+' · '+esc(sz)+' — tap to edit cost/price/location">'+
        '<div class="bc-qty num">'+fmtNum(v.system_quantity)+'</div>'+
      '</div>';
    }).join('');
    return '<div style="display:grid;grid-template-columns:60px repeat('+colors.length+',1fr);gap:8px;align-items:center;">'+
      '<div style="font-weight:800;font-size:12.5px;">'+esc(sz)+'</div>'+cells+
    '</div>';
  }).join('');

  var colorLegend = colors.map(function(cc){ var cm=colorMeta(cc); return '<div class="chip"><span class="swatch" style="background:'+cm.hex+'"></span>'+esc(cm.name)+'</div>'; }).join('');

  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">'+colorLegend+'</div>'+
    '<div class="bracket" style="margin-bottom:8px;">'+head+rows+'</div>'+
    '<div style="color:var(--text-2);font-size:11px;margin-bottom:14px;">Tap a cell to edit that size/color\'s cost, price or location.</div>';
}

/* ---------------- image (canvas) export, spreadsheet-style ---------------- */
function luminance(hex){
  hex = (hex||'#888888').replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
  var r=parseInt(hex.substr(0,2),16)/255, g=parseInt(hex.substr(2,2),16)/255, b=parseInt(hex.substr(4,2),16)/255;
  function lin(c){ return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function contrastText(hex){ return luminance(hex) > 0.55 ? '#1D1D1F' : '#FFFFFF'; }

/* Wraps to as many lines as actually needed to fit maxWidth — no forced
   line cap. Color-name text width varies by which font a device actually
   substitutes for Khmer glyphs (phones and laptops don't always agree), so
   a hard 2-line cap that then jams the overflow into one line was causing
   cramped/overlapping header text on some phones. Callers size the header
   row from the line count this returns instead of assuming a fixed height. */
function wrapLines(ctx, text, maxWidth){
  var words = String(text).split(' ');
  var lines = [], cur = '';
  words.forEach(function(w){
    var test = cur ? cur+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function drawWrappedLines(ctx, lines, cx, cy, lineHeight){
  var lh = lineHeight || 14;
  var startY = cy - ((lines.length-1)*lh)/2;
  lines.forEach(function(ln,i){ ctx.fillText(ln, cx, startY+i*lh); });
}

/* Loads a photo for drawing into the export canvas. crossOrigin is required
   so the canvas isn't "tainted" (which would block downloading/copying the
   finished image) — that only works if the storage bucket serving the photo
   has CORS enabled for GET requests. If it isn't (or the photo fails to
   load for any reason), this resolves to null and the block is drawn
   without a photo rather than failing the whole export. */
function loadImage(url){
  return new Promise(function(resolve){
    if(!url){ resolve(null); return; }
    var img = new Image();
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done=true; resolve(null); } }, 6000);
    img.crossOrigin = 'anonymous';
    img.onload = function(){ if(done) return; done=true; clearTimeout(timer); resolve(img); };
    img.onerror = function(){ if(done) return; done=true; clearTimeout(timer); resolve(null); };
    img.src = url;
  });
}
/* Draws img into the dx,dy,dw,dh box, cropping (not squashing) to fill it —
   same idea as CSS object-fit:cover. */
function drawImageCover(ctx, img, dx, dy, dw, dh){
  var iw = img.naturalWidth||img.width, ih = img.naturalHeight||img.height;
  if(!iw || !ih) return;
  var ir = iw/ih, dr = dw/dh, sx, sy, sw, sh;
  if(ir > dr){ sh = ih; sw = ih*dr; sx = (iw-sw)/2; sy = 0; }
  else { sw = iw; sh = iw/dr; sx = 0; sy = (ih-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

/* One image PER CODE, not one giant combined image. A single tall canvas
   covering a whole stock take can hit a phone's canvas size ceiling once
   there are enough codes (iOS Safari in particular caps out around
   16.7 million total pixels — roughly a 4096x4096 image). Per-code images
   stay small no matter how many codes are in the stock take, so there's no
   upper limit on stock take size, and each one is still a complete,
   shareable picture on its own (carries the stock take number/date/staff
   in its own header) if sent to Telegram individually.
   Returns a Promise<Array<{code, canvas}>>. */
/* Shared by the image export and the Excel export so both always agree on
   exactly the same grouping/ordering of codes, colors and sizes. */
function computeStocktakeCodeBlocks(stId){
  var items = itemsForStocktake(stId).filter(function(i){return i.status!=='NOT COUNTED';});
  var byCode = {};
  items.forEach(function(i){ (byCode[i.code]=byCode[i.code]||[]).push(i); });
  var codes = Object.keys(byCode).sort();

  var blocks = codes.map(function(code){
    var rows = byCode[code];
    var colors = []; rows.forEach(function(i){ if(colors.indexOf(i.color)===-1) colors.push(i.color); });
    var sizeOrder = catMeta(codeInfo(code).category).sizes;
    var sizes = []; rows.forEach(function(i){ if(sizes.indexOf(i.size)===-1) sizes.push(i.size); });
    sizes.sort(function(a,b){ return sizeOrder.indexOf(a)-sizeOrder.indexOf(b); });
    var grid = {}; rows.forEach(function(i){ grid[i.color+'|'+i.size] = i.physical_quantity; });
    var colTotals = {};
    colors.forEach(function(cc){ colTotals[cc] = sizes.reduce(function(sum,sz){ var v=grid[cc+'|'+sz]; return sum+(v||0); },0); });
    var grandTotal = colors.reduce(function(sum,cc){ return sum+colTotals[cc]; },0);
    var firstVariant = productsForCode(code)[0];
    return {code:code, colors:colors, sizes:sizes, grid:grid, colTotals:colTotals, grandTotal:grandTotal, photoUrl: (firstVariant&&firstVariant.image)||null};
  });

  if(!blocks.length){
    blocks.push({code:'—', colors:[], sizes:[], grid:{}, colTotals:{}, grandTotal:0, photoUrl:null});
  }
  return blocks;
}

function buildStocktakeCodeImages(stId){
  var s = state.stocktakes.find(function(x){return x.id===stId;});
  var blocks = computeStocktakeCodeBlocks(stId);
  return Promise.all(blocks.map(function(b){
    return loadImage(b.photoUrl).then(function(img){
      return {code:b.code, canvas: drawCodeBlockCanvas(s, b, img)};
    });
  }));
}

/* ---------------- Excel (.xlsx) export ----------------
   Same layout as the picture export — one sheet per code, colors across
   the top, sizes down the side, a totals row/column — built with SheetJS,
   loaded on demand so the ~1MB library isn't fetched unless someone
   actually uses this export. */
function loadXLSXLib(){
  if(window.XLSX) return Promise.resolve();
  if(window.__xlsxLoadPromise) return window.__xlsxLoadPromise;
  window.__xlsxLoadPromise = new Promise(function(resolve, reject){
    var el = document.createElement('script');
    el.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    el.onload = function(){ resolve(); };
    el.onerror = function(){ window.__xlsxLoadPromise = null; reject(new Error('Failed to load xlsx library')); };
    document.head.appendChild(el);
  });
  return window.__xlsxLoadPromise;
}
function sanitizeSheetName(name, usedNames){
  var clean = String(name).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || 'Sheet';
  var final = clean, i=2;
  while(usedNames[final]){ final = (clean.slice(0,28)+'_'+i).slice(0,31); i++; }
  usedNames[final] = true;
  return final;
}
function buildStocktakeWorkbook(stId){
  var s = state.stocktakes.find(function(x){return x.id===stId;});
  var blocks = computeStocktakeCodeBlocks(stId);
  var wb = XLSX.utils.book_new();

  // Every code's full bracket grid, one after another in a SINGLE sheet —
  // matching how the real spreadsheet is laid out (one continuous sheet
  // with every code's block stacked), rather than splitting codes across
  // separate sheet tabs.
  var maxCols = Math.max.apply(null, blocks.map(function(b){return b.colors.length;}).concat([1]));
  var aoa = [];
  aoa.push(['VHM Stock Take'+(s?(' - '+s.number):'')]);
  aoa.push([s?(fmtDate(s.date)+'  ·  '+s.warehouse+'  ·  '+s.staff):'']);
  aoa.push([]);

  var overallTotal = 0;
  blocks.forEach(function(b){
    overallTotal += b.grandTotal;
    var sizesToUse = b.sizes.length ? b.sizes : ['—'];
    aoa.push([b.code, '', '', 'Total: '+b.grandTotal]);
    aoa.push([''].concat(b.colors.map(function(cc){ return colorMeta(cc).name; })));
    sizesToUse.forEach(function(sz){
      var row = [sz];
      b.colors.forEach(function(cc){ var v=b.grid[cc+'|'+sz]; row.push((v===undefined||v===null)?'':v); });
      aoa.push(row);
    });
    var totalsRow = ['សរុប'];
    b.colors.forEach(function(cc){ totalsRow.push(b.colTotals[cc]); });
    aoa.push(totalsRow);
    aoa.push([]); // blank row between code blocks
  });
  aoa.push(['Grand Total (all codes)', overallTotal]);

  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var cols = [{wch:18}];
  for(var i=0;i<maxCols;i++) cols.push({wch:16});
  ws['!cols'] = cols;
  XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(s?s.number:'Stock Take', {}));
  return wb;
}

/* ---------------- Products page image/Excel export ----------------
   Same picture and spreadsheet shape as the stock take export above, but
   built from Products' current system quantity for a given list of codes
   instead of one stock take's counted items — this is what "pull image /
   xlsx like history" on the Products page gives you: a shareable snapshot
   of on-hand stock, not of a specific count. */
function computeProductsCodeBlocks(codes){
  var blocks = codes.map(function(code){
    var variants = orderedVariants(code);
    var colors = uniqueColors(variants);
    var sizeOrder = catMeta(codeInfo(code).category).sizes;
    var sizes = uniqueSizes(variants).slice().sort(function(a,b){ return sizeOrder.indexOf(a)-sizeOrder.indexOf(b); });
    var grid = {}; variants.forEach(function(v){ grid[v.color+'|'+v.size] = v.system_quantity; });
    var colTotals = {}; colors.forEach(function(cc){ colTotals[cc] = sizes.reduce(function(sum,sz){ var v=grid[cc+'|'+sz]; return sum+(v||0); },0); });
    var grandTotal = colors.reduce(function(sum,cc){ return sum+colTotals[cc]; },0);
    return {code:code, colors:colors, sizes:sizes, grid:grid, colTotals:colTotals, grandTotal:grandTotal, photoUrl:(variants[0]&&variants[0].image)||null};
  });
  if(!blocks.length){ blocks.push({code:'—', colors:[], sizes:[], grid:{}, colTotals:{}, grandTotal:0, photoUrl:null}); }
  return blocks;
}
function buildProductsCodeImages(codes){
  var blocks = computeProductsCodeBlocks(codes);
  var titleInfo = {title:'VHM Products — current stock', subtitle: new Date().toLocaleDateString()};
  return Promise.all(blocks.map(function(b){
    return loadImage(b.photoUrl).then(function(img){
      return {code:b.code, canvas: drawCodeBlockCanvas(titleInfo, b, img)};
    });
  }));
}
function buildProductsWorkbook(codes){
  var blocks = computeProductsCodeBlocks(codes);
  var wb = XLSX.utils.book_new();
  var maxCols = Math.max.apply(null, blocks.map(function(b){return b.colors.length;}).concat([1]));
  var aoa = [];
  aoa.push(['VHM Products — current stock']);
  aoa.push([new Date().toLocaleDateString()]);
  aoa.push([]);
  var overallTotal = 0;
  blocks.forEach(function(b){
    overallTotal += b.grandTotal;
    var sizesToUse = b.sizes.length ? b.sizes : ['—'];
    aoa.push([b.code, '', '', 'Total: '+b.grandTotal]);
    aoa.push([''].concat(b.colors.map(function(cc){ return colorMeta(cc).name; })));
    sizesToUse.forEach(function(sz){
      var row = [sz];
      b.colors.forEach(function(cc){ var v=b.grid[cc+'|'+sz]; row.push((v===undefined||v===null)?'':v); });
      aoa.push(row);
    });
    var totalsRow = ['សរុប'];
    b.colors.forEach(function(cc){ totalsRow.push(b.colTotals[cc]); });
    aoa.push(totalsRow);
    aoa.push([]);
  });
  aoa.push(['Grand Total (all codes)', overallTotal]);
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var cols = [{wch:18}];
  for(var i=0;i<maxCols;i++) cols.push({wch:16});
  ws['!cols'] = cols;
  XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName('Products', {}));
  return wb;
}

function drawCodeBlockCanvas(s, b, photoImg){
  var FONT_STACK = '"Khmer OS", "Noto Sans Khmer", "Khmer Sangam MN", -apple-system, Helvetica, Arial, sans-serif';
  var PAD=24, LABEL_W=86, CELL_W=112, ROW_H=40, HEADER_LINE_H=15, HEADER_PAD=18, PHOTO_SIZE=48, TOP_H=64;
  var TITLE_H = photoImg ? 64 : 40;

  var width = Math.max(PAD*2 + LABEL_W + Math.max(b.colors.length,1)*CELL_W, 420);

  var measureCanvas = document.createElement('canvas');
  var mctx = measureCanvas.getContext('2d');
  mctx.font = '700 12px '+FONT_STACK;
  var maxLines = 1;
  b.colors.forEach(function(cc){
    var lines = wrapLines(mctx, colorMeta(cc).name, CELL_W-14);
    if(lines.length > maxLines) maxLines = lines.length;
  });
  var HEADER_H = Math.max(HEADER_PAD*2 + maxLines*HEADER_LINE_H, 44);

  var sizesToDraw = b.sizes.length ? b.sizes : ['—'];
  var height = TOP_H + TITLE_H + HEADER_H + sizesToDraw.length*ROW_H + ROW_H + PAD + 16;

  var canvas = document.createElement('canvas');
  var scale = 2;
  canvas.width = Math.round(width*scale); canvas.height = Math.round(height*scale);
  canvas.style.width = width+'px'; canvas.style.height = height+'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);

  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,width,height);

  // s is a real stock-take record for the stock-take export, or a plain
  // {title, subtitle} for the Products export (no specific stock take
  // behind it) — either way we just need a header line and a sub-line.
  var headerTitle = s ? ('VHM Stock Take'+(s.number?(' · '+s.number):'')) : 'VHM Stock Take';
  var headerSub = '';
  if(s && s.number){ headerSub = fmtDate(s.date)+'  ·  '+s.warehouse+'  ·  '+s.staff; }
  else if(s && s.title){ headerTitle = s.title; headerSub = s.subtitle||''; }
  ctx.fillStyle = '#1D1D1F';
  ctx.font = '700 16px '+FONT_STACK;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText(headerTitle, PAD, PAD-8);
  ctx.fillStyle = '#6B7280';
  ctx.font = '400 12px '+FONT_STACK;
  ctx.fillText(headerSub, PAD, PAD+14);

  var y = TOP_H;
  ctx.fillStyle = '#1D1D1F';
  ctx.fillRect(PAD, y, width-PAD*2, TITLE_H);
  var textStartX = PAD+12;
  if(photoImg){
    var pad = (TITLE_H-PHOTO_SIZE)/2;
    drawImageCover(ctx, photoImg, PAD+pad, y+pad, PHOTO_SIZE, PHOTO_SIZE);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.strokeRect(PAD+pad+0.5, y+pad+0.5, PHOTO_SIZE-1, PHOTO_SIZE-1);
    textStartX = PAD+pad+PHOTO_SIZE+12;
  }
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 16px '+FONT_STACK;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(b.code, textStartX, y+TITLE_H/2);
  ctx.font = '400 12px '+FONT_STACK;
  ctx.textAlign = 'right';
  ctx.fillText('Total: '+b.grandTotal, PAD+(width-PAD*2)-12, y+TITLE_H/2);
  ctx.textAlign = 'left';
  y += TITLE_H;

  var x = PAD;
  ctx.fillStyle = '#F4F4F5'; ctx.fillRect(x, y, LABEL_W, HEADER_H);
  ctx.strokeStyle = '#E5E7EB'; ctx.strokeRect(x,y,LABEL_W,HEADER_H);
  x += LABEL_W;
  b.colors.forEach(function(cc){
    var cm = colorMeta(cc);
    ctx.fillStyle = cm.hex; ctx.fillRect(x, y, CELL_W, HEADER_H);
    ctx.strokeStyle='#E5E7EB'; ctx.strokeRect(x,y,CELL_W,HEADER_H);
    ctx.fillStyle = contrastText(cm.hex);
    ctx.font = '700 12px '+FONT_STACK;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    var lines = wrapLines(ctx, cm.name, CELL_W-14);
    drawWrappedLines(ctx, lines, x+CELL_W/2, y+HEADER_H/2, HEADER_LINE_H);
    x += CELL_W;
  });
  ctx.textAlign='left';
  y += HEADER_H;

  sizesToDraw.forEach(function(sz, ri){
    var x2 = PAD;
    ctx.fillStyle = ri%2===0?'#FFFFFF':'#FAFAFA';
    ctx.fillRect(x2,y,width-PAD*2,ROW_H);
    ctx.strokeStyle='#E5E7EB'; ctx.strokeRect(x2,y,LABEL_W,ROW_H);
    ctx.fillStyle='#1D1D1F';
    ctx.font='700 13px '+FONT_STACK;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(sz, x2+LABEL_W/2, y+ROW_H/2);
    x2 += LABEL_W;
    b.colors.forEach(function(cc){
      ctx.strokeStyle='#E5E7EB'; ctx.strokeRect(x2,y,CELL_W,ROW_H);
      var v = b.grid[cc+'|'+sz];
      ctx.fillStyle = (v===undefined||v===null)?'#C4C4C8':'#1D1D1F';
      ctx.font='400 14px '+FONT_STACK;
      ctx.fillText((v===undefined||v===null)?'—':String(v), x2+CELL_W/2, y+ROW_H/2);
      x2 += CELL_W;
    });
    y += ROW_H;
  });

  var x3 = PAD;
  ctx.fillStyle = '#EEF2F6'; ctx.fillRect(x3,y,width-PAD*2,ROW_H);
  ctx.strokeStyle='#E5E7EB'; ctx.strokeRect(x3,y,LABEL_W,ROW_H);
  ctx.fillStyle='#1D1D1F';
  ctx.font='700 12px '+FONT_STACK;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('សរុប', x3+LABEL_W/2, y+ROW_H/2);
  x3 += LABEL_W;
  b.colors.forEach(function(cc){
    ctx.strokeStyle='#E5E7EB'; ctx.strokeRect(x3,y,CELL_W,ROW_H);
    ctx.fillStyle='#1D1D1F';
    ctx.font='700 14px '+FONT_STACK;
    ctx.fillText(String(b.colTotals[cc]), x3+CELL_W/2, y+ROW_H/2);
    x3 += CELL_W;
  });
  ctx.textAlign='left';
  y += ROW_H;

  ctx.fillStyle = '#9CA3AF';
  ctx.font='400 10px '+FONT_STACK;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('Generated by VHM Stock Take · '+new Date().toLocaleString(), PAD, y+10);

  return canvas;
}

function downloadCanvasImage(canvas, filename){
  try{
    canvas.toBlob(function(blob){
      if(!blob){ toast('Could not create image'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }, 'image/png');
  }catch(e){ toast('Could not download image'); }
}

function copyCanvasImage(canvas){
  try{
    canvas.toBlob(function(blob){
      if(!blob){ toast('Could not create image'); return; }
      if(navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new window.ClipboardItem({'image/png': blob})]).then(function(){
          toast('Image copied to clipboard');
        }, function(){ toast('Copy not supported on this browser — use Download image instead'); });
      } else {
        toast('Copy not supported on this browser — use Download image instead');
      }
    }, 'image/png');
  }catch(e){ toast('Could not copy image'); }
}

  // products

  if(t.closest('#close-detail') || t.id==='detail-backdrop'){ state.ui.viewCode=null; editVariantCtx=null; renderPage(); return; }
  var editVarBtn = t.closest('[data-edit-variant]'); if(editVarBtn){ var vid=editVarBtn.getAttribute('data-edit-variant'); editVariantCtx = state.products.find(function(p){return p.id===vid;}); renderPage(); return; }
  if(t.closest('#close-editvariant')){ editVariantCtx=null; renderPage(); return; }
  if(t.closest('#ev-save')){ submitEditVariant(); return; }

  // history
  var viewStRow = t.closest('[data-view-st]'); if(viewStRow){ state.ui.viewStId = viewStRow.getAttribute('data-view-st'); renderPage(); return; }
  if(t.closest('#close-report') || t.id==='report-backdrop'){ state.ui.viewStId=null; renderPage(); return; }

  // categories
  var saveCat = t.closest('[data-save-cat]'); if(saveCat){ submitCategorySave(saveCat.getAttribute('data-save-cat')); return; }
  if(t.closest('#btn-add-color')){ state.settings.colors.push({code:'new'+state.settings.colors.length, name:'New color', hex:'#999999'}); renderPage(); return; }
  var rmColor = t.closest('[data-remove-color]'); if(rmColor){ state.settings.colors.splice(parseInt(rmColor.getAttribute('data-remove-color'),10),1); renderPage(); return; }
  if(t.closest('#btn-save-colors')){ persistSettings(); toast('Palette saved'); return; }

  if(t.closest('#btn-save-staff')){ var v1=document.getElementById('set-staff').value; state.settings.staff = v1.split(',').map(function(s){return s.trim();}).filter(Boolean); persistSettings(); toast('Staff list saved'); return; }
  if(t.closest('#btn-save-wh')){ var v2=document.getElementById('set-wh').value; state.settings.warehouses = v2.split(',').map(function(s){return s.trim();}).filter(Boolean); persistSettings(); toast('Warehouses saved'); return; }
  if(t.closest('#btn-load-sample')){ seedProducts().then(function(){ toast('Sample codes added'); }); return; }
  if(t.closest('#btn-reset-demo')){ openConfirmModal('Clear all data?','This permanently deletes every product, stock take and count on this workspace. This cannot be undone.', function(){ resetAllData(); }); return; }

  // confirm modal
  if(t.closest('#confirm-yes')){ if(confirmCtx && confirmCtx.onYes) confirmCtx.onYes(); confirmCtx=null; document.getElementById('modalRoot').innerHTML=''; return; }
  if(t.closest('#confirm-no') || t.id==='confirm-backdrop'){ confirmCtx=null; document.getElementById('modalRoot').innerHTML=''; return; }

  // passcode modal
  if(t.closest('#passcode-yes')){ submitPasscode(); return; }
  if(t.closest('#passcode-no') || t.id==='passcode-backdrop'){ passcodeCtx=null; document.getElementById('modalRoot').innerHTML=''; return; }

/* ---------------- new code / variant edit submit ---------------- */
function submitNewCode(){
  var c = newCodeCtx;
  var code = (document.getElementById('nc-code')||{}).value || c.code;
  code = slug(code);
  if(!code){ toast('Enter a product code'); return; }
  if(state.products.some(function(p){return p.code===code;})){ toast('That code already exists'); return; }
  var name = (document.getElementById('nc-name')||{}).value || c.name || code;
  var sub = (document.getElementById('nc-sub')||{}).value || c.subcategory;
  var cost = parseFloat((document.getElementById('nc-cost')||{}).value || c.cost) || 0;
  var price = parseFloat((document.getElementById('nc-price')||{}).value || c.price) || 0;
  if(!c.sizes.length || !c.colors.length){ toast('Pick at least one size and one color'); return; }
  var col = state.db.collection('vhm_stocktake_products');
  var ops = [];
  c.sizes.forEach(function(sz){
    c.colors.forEach(function(cc){
      var id = code+'_'+slug(sz)+'_'+cc;
      ops.push({id:id, data:{ code:code, name:name, category:c.category, subcategory:sub, color:cc, size:sz, location:'', barcode:id.toUpperCase(), system_quantity:0, unit_cost:cost, selling_price:price, created_at:Date.now(), updated_at:Date.now() }});
    });
  });
  var photoFile = c.photoFile;
  ops.reduce(function(p,op){ return p.then(function(){ return col.doc(op.id).set(op.data); }); }, Promise.resolve()).then(function(){
    // optimistic local update — no live listener to pick these up anymore
    ops.forEach(function(op){ state.products.push(Object.assign({id:op.id}, op.data)); });
    toast('Template created: '+ops.length+' variants');
    newCodeCtx=null; state.ui.openCode = code; document.getElementById('modalRoot').innerHTML='';
    if(state.route!=='stocktake') go('products'); else renderPage();
    if(photoFile) uploadCodePhoto(code, photoFile);
  });
}
function submitEditVariant(){
  var v = editVariantCtx;
  var loc = document.getElementById('ev-location').value;
  var qty = parseFloat(document.getElementById('ev-qty').value)||0;
  var cost = parseFloat(document.getElementById('ev-cost').value)||0;
  var price = parseFloat(document.getElementById('ev-price').value)||0;
  state.db.collection('vhm_stocktake_products').doc(v.id).update({location:loc, system_quantity:qty, unit_cost:cost, selling_price:price, updated_at:Date.now()}).then(function(){
    var idx = state.products.findIndex(function(p){return p.id===v.id;});
    if(idx>-1) state.products[idx] = Object.assign({}, state.products[idx], {location:loc, system_quantity:qty, unit_cost:cost, selling_price:price, updated_at:Date.now()});
    toast('Product updated'); editVariantCtx=null; renderPage();
  });
}
function submitCategorySave(key){
  var prefixEl = document.querySelector('[data-cat-field="'+key+':codePrefix"]');
  var subEl = document.querySelector('[data-cat-field="'+key+':subcats"]');
  var sizeEl = document.querySelector('[data-cat-field="'+key+':sizes"]');
  state.settings.categories[key].codePrefix = (prefixEl.value||'').trim().toUpperCase();
  state.settings.categories[key].subcats = subEl.value.split(',').map(function(s){return s.trim();}).filter(Boolean);

function persistSettings(){
  return state.db.collection('vhm_stocktake_meta').doc('settings').set(state.settings).catch(function(){});
}
function resetAllData(){
  var cols = ['vhm_stocktake_products','vhm_stocktake_stocktakes','vhm_stocktake_items'];
  Promise.all(cols.map(function(c){
    return state.db.collection(c).get().then(function(qs){
      return qs.docs.reduce(function(p,d){ return p.then(function(){ return state.db.collection(c).doc(d.id).delete(); }); }, Promise.resolve());
    });
  })).then(function(){
    state.products=[]; state.stocktakes=[]; state.items=[]; state.ui.activeStocktakeId=null;
    toast('All product and stock-take data cleared');
    renderPage();
  });
}

function downloadText(filename, text){
  try{
    var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ toast('Could not download — try Copy instead'); }
}

/* ---------------- outside-the-app alert (Telegram) ----------------
   Fills the "notify other admins outside the app" half of the request: when
   a code finishes counting, ping a Telegram chat so an admin sees it even
   with the app closed, then comes in to tick VRich/Popok once transferred.

   Set up once (a few minutes, no coding):
     1. In Telegram, message @BotFather -> /newbot -> follow the prompts.
        It gives you a bot token like "123456789:AA...". Paste it below as
        TELEGRAM_BOT_TOKEN.
     2. Add that bot to the admin group chat (or DM it directly for a single
        admin), send it any message, then open:
        https://api.telegram.org/bot<YOUR_TOKEN>/getUpdates
        and find "chat":{"id": ...} in the response — that number (it's
        negative for a group) is TELEGRAM_CHAT_ID below.
     3. Reload the app. Leave both blank to keep this feature off.

   Security note: because this is a static page with no backend, the bot
   token below is visible to anyone who views the page source — same trust
   model as the open Firestore rules and the admin passcode already used
   in this app. Don't reuse a bot/token you use anywhere sensitive. */
var TELEGRAM_BOT_TOKEN = '';
var TELEGRAM_CHAT_ID = '';
function notifyTelegram(text){
  if(!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return; // not configured — silently a no-op
  fetch('https://api.telegram.org/bot'+TELEGRAM_BOT_TOKEN+'/sendMessage', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: text})
  }).catch(function(e){ console.error('Telegram notify failed (non-fatal)', e); });
}

/* ---------------- passcode-gated destructive actions ----------------
   Deleting a code or a stock-take record is permanent, so it sits behind
   a short admin passcode rather than just a confirm dialog — enough to
   stop an accidental tap from a staff member's phone. Change ADMIN_PASSCODE
   below if you want a different one. */
var ADMIN_PASSCODE = 'Admin2026@';
var passcodeCtx = null;
function openPasscodeModal(title, body, onCorrect){
  passcodeCtx = {onCorrect:onCorrect};
  document.getElementById('modalRoot').innerHTML = '<div class="modal-backdrop center" id="passcode-backdrop"><div class="modal-sheet" style="max-width:340px;">'+
    '<div class="modal-head"><h3>'+esc(title)+'</h3></div>'+
    '<div style="color:var(--text-2);font-size:12.5px;margin-bottom:12px;">'+esc(body)+'</div>'+
    field('Admin passcode','<input type="password" id="passcode-input" autocomplete="off" placeholder="Enter passcode"/>')+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-block" id="passcode-no">Cancel</button><button class="btn btn-danger btn-block" id="passcode-yes">Delete</button></div>'+
  '</div></div>';
  var input = document.getElementById('passcode-input');
  if(input) input.focus();
}
function submitPasscode(){
  var input = document.getElementById('passcode-input');
  var val = input ? input.value : '';
  if(val === ADMIN_PASSCODE){
    var cb = passcodeCtx && passcodeCtx.onCorrect;
    passcodeCtx = null;
    document.getElementById('modalRoot').innerHTML = '';
    if(cb) cb();
  } else {
    toast('Incorrect passcode');
    if(input){ input.value=''; input.focus(); }
  }
}

/* ---------------- delete code / delete stock take ---------------- */
function deleteProductCode(code){
  var variants = productsForCode(code);
  var col = state.db.collection('vhm_stocktake_products');
  variants.reduce(function(p,v){ return p.then(function(){ return col.doc(v.id).delete(); }); }, Promise.resolve())
    .then(function(){ return state.db.collection('vhm_stocktake_code_status').doc(code).delete().catch(function(){}); })
    .then(function(){
      state.products = state.products.filter(function(p){ return p.code!==code; });
      delete state.codeStatus[code];
      toast('Code '+code+' deleted');
      state.ui.viewCode = null;
      renderPage();
    });
}
function deleteStocktakeRecord(stId){
  var itemsCol = state.db.collection('vhm_stocktake_items');
  itemsCol.get().then(function(qs){
    var toDelete = qs.docs.filter(function(d){ return d.data().stocktake_id === stId; });
    return toDelete.reduce(function(p,d){ return p.then(function(){ return itemsCol.doc(d.id).delete(); }); }, Promise.resolve());
  }).then(function(){
    return state.db.collection('vhm_stocktake_stocktakes').doc(stId).delete();
  }).then(function(){
    state.items = state.items.filter(function(i){ return i.stocktake_id!==stId; });
    state.stocktakes = state.stocktakes.filter(function(s){ return s.id!==stId; });
    toast('Stock take deleted');
    state.ui.viewStId = null;
    if(state.ui.activeStocktakeId === stId) state.ui.activeStocktakeId = null;
    renderPage();
  });
}

/* ---------------- photo upload (Firebase Storage) ---------------- */
function extFromMime(type){
  if(type==='image/png') return 'png';
  if(type==='image/webp') return 'webp';
  if(type==='image/heic' || type==='image/heif') return 'heic';
  return 'jpg';
}
function uploadCodePhoto(code, file, onDone){
  if(!state.storage){ toast('Photo upload needs the shared connection — try again once online'); return; }
  if(!file) return;
  toast('Uploading photo…');
  var path = 'vhm_stocktake_photos/'+code+'_'+Date.now()+'.'+extFromMime(file.type);
  state.storage.upload(path, file).then(function(url){
    var variants = productsForCode(code);
    var col = state.db.collection('vhm_stocktake_products');
    return variants.reduce(function(p,v){ return p.then(function(){ return col.doc(v.id).update({image:url}); }); }, Promise.resolve()).then(function(){ return url; });
  }).then(function(url){
    state.products.forEach(function(p){ if(p.code===code) p.image = url; });
    toast('Photo saved');
    if(onDone) onDone(url);
    renderPage();
  }).catch(function(err){
    console.error('Photo upload failed', err);
    toast('Photo upload failed — check Storage rules');
  });
}

/* ---------------- boot ----------------
   Initial paint happens immediately (before Firestore connects) so the
   page never sits on a blank screen; bootWithDb() — called by the
   Firebase module script below, or by the safety-net timeout above —
   swaps in real data and starts the live subscriptions. */
var initialRoute = (location.hash||'#dashboard').slice(1);
if(['dashboard','stocktake','products','categories','history','reports','settings'].indexOf(initialRoute)>-1) state.route = initialRoute;
renderShell(); renderPage();

// Version check: once shortly after load, every time the tab/app comes back
// into view (the most common case — someone reopens a bookmarked/home-screen
// copy that's been sitting stale), and every 5 minutes for a long-open tab.
setTimeout(checkForAppUpdate, 4000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkForAppUpdate(); });
setInterval(checkForAppUpdate, 5*60*1000);

})();
</script>

<script type="module">
  // Firebase project: vhm-data (on the Blaze plan — separate from vhm-menu,
  // which the catalog/live log/stock locator share). Stock Take moved here
  // on its own since it's self-contained (its own vhm_stocktake_* collections,
  // not referenced by any other tool) and was the main driver of vhm-menu's
  // Firestore read quota getting maxed out.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore,
    collection, doc, setDoc, updateDoc, deleteDoc, addDoc,
    getDoc, getDocs, onSnapshot, query, where, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  import {
    getStorage, ref, uploadBytes, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

  var firebaseConfig = {
    apiKey: "AIzaSyDxF04KvMQUg7kEQw4fFA4U_hiSoMyrUjs",
    authDomain: "vhm-data.firebaseapp.com",
    projectId: "vhm-data",
    storageBucket: "vhm-data.firebasestorage.app",
    messagingSenderId: "983915578738",
    appId: "1:983915578738:web:eb4b94478f1411a6c009eb"
  };
  // Exposed so the Settings screen can show which project this device is
  // actually talking to — a device stuck on an old copy pointed at the old
  // project shows up immediately instead of just looking like "no data".
  window.__VHM_FIREBASE_PROJECT__ = firebaseConfig.projectId;

  try {
    var app = initializeApp(firebaseConfig);
    // Plain, memory-only Firestore client — fast to start, no IndexedDB
    // overhead on every read/write. An earlier version turned on full offline
    // persistence (persistentLocalCache) here to stop a Done-status write
    // made mid-signal-drop from silently getting lost, but that made the app
    // noticeably less snappy: IndexedDB has to spin up before the first
    // request goes out, and every single write (every counted quantity, not
    // just Done status) gets written through IndexedDB first, which is slow
    // on phones, especially in Safari. The specific reliability problem is
    // narrow — a handful of code-status writes, not every write — so it's
    // handled with a small localStorage retry queue instead (see
    // vhmPendingStatusQueue below), which is effectively instant to read and
    // write and only touches the one collection that actually needs it.
    var fsdb = getFirestore(app);
    var mod = { collection:collection, doc:doc, setDoc:setDoc, updateDoc:updateDoc, deleteDoc:deleteDoc, addDoc:addDoc, getDoc:getDoc, getDocs:getDocs, onSnapshot:onSnapshot, query:query, where:where, orderBy:orderBy, limit:limit };
    var dbAdapter = window.__vhmMakeFirebaseAdapter(fsdb, mod);

    var storageAdapter = null;
    try {
      var storageInstance = getStorage(app);
      storageAdapter = {
        upload: function(path, file){
          return uploadBytes(ref(storageInstance, path), file).then(function(snap){
            return getDownloadURL(snap.ref);
          });
        }
      };
    } catch(e2){ console.error('VHM Stock Take: Firebase Storage unavailable, photo upload disabled.', e2); }

    window.__vhmBoot(dbAdapter, true, storageAdapter);
  } catch (e) {
    console.error('VHM Stock Take: Firebase init failed, falling back to on-device storage.', e);
    window.__vhmBoot(null, false, null);
  }
</script>
