<!doctype html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VHM Stock Take</title>
<meta name="description" content="Bracket-grid stock counting, dashboard, history and reports for VHM Club, synced live across staff phones via Firebase.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VHM Stock">
<meta name="theme-color" content="#1F3A5F">
<!-- Bump this on every deploy. The app polls its own file for this tag to
     detect when a device is running a stale cached copy (see checkForAppUpdate
     in the main script) — this is what makes version mismatches visible
     instead of silently causing "my data isn't there" confusion. -->
<meta name="app-version" content="2026.09.28.17">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --primary:#1F3A5F; --primary-ink:#16304f; --primary-tint:#E7ECF3;
  --bg:#F7F8FA; --card:#FFFFFF; --text:#171A1F; --text-2:#6B7280;
  --success:#16803C; --success-bg:#E7F5EC;
  --warning:#C77700; --warning-bg:#FDF1E0;
  --danger:#C62828; --danger-bg:#FBEAEA;
  --gray-bg:#EEF0F3; --gray-ink:#6B7280;
  --border:#E5E7EB;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(23,26,31,.05), 0 2px 10px rgba(23,26,31,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#7BA0D4; --primary-ink:#9AB6DE; --primary-tint:rgba(123,160,212,.14);
    --bg:#12161C; --card:#1A2028; --text:#EDEFF2; --text-2:#98A2B3;
    --success:#3FB56C; --success-bg:rgba(63,181,108,.14);
    --warning:#E2A03F; --warning-bg:rgba(226,160,63,.14);
    --danger:#E2645F; --danger-bg:rgba(226,100,95,.14);
    --gray-bg:#232A34; --gray-ink:#98A2B3;
    --border:#28303B;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 14px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#7BA0D4; --primary-ink:#9AB6DE; --primary-tint:rgba(123,160,212,.14);
  --bg:#12161C; --card:#1A2028; --text:#EDEFF2; --text-2:#98A2B3;
  --success:#3FB56C; --success-bg:rgba(63,181,108,.14);
  --warning:#E2A03F; --warning-bg:rgba(226,160,63,.14);
  --danger:#E2645F; --danger-bg:rgba(226,100,95,.14);
  --gray-bg:#232A34; --gray-ink:#98A2B3;
  --border:#28303B;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 14px rgba(0,0,0,.4);
  color-scheme:dark;
}
/* This is used like a native app on phones during counting — fast repeated
   taps on the keypad, stepper and bracket cells. Without this, mobile
   browsers hold every tap for ~300ms waiting to see if a second tap follows
   (to double-tap-zoom), which both causes that annoying zoom-on-double-tap
   and can eat/delay a genuine quick second press meant to correct a
   quantity. touch-action:manipulation (+ the viewport's user-scalable=no
   above) disables that gesture everywhere in the app; nothing here needs
   pinch/double-tap zoom to work. */
*{box-sizing:border-box; touch-action:manipulation;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;}
h1,h2,h3,.num,.mono{font-family:'Manrope',system-ui,sans-serif;}
.num{font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}
a{color:var(--primary);}
::selection{background:var(--primary-tint);}
[hidden]{display:none!important;}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-sm{width:16px;height:16px;}
.icon-lg{width:28px;height:28px;}

#app{min-height:100vh;display:flex;}
.sidebar{width:232px;flex:none;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Manrope',sans-serif;font-size:15px;flex:none;}
.brand-text b{display:block;font-size:14.5px;font-weight:800;letter-spacing:.2px;}
.brand-text span{display:block;font-size:11px;color:var(--text-2);}
.navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
.navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.navlink:hover{background:var(--gray-bg);color:var(--text);}
.navlink.active{background:var(--primary-tint);color:var(--primary-ink);}
.navlink.active .icon{stroke:var(--primary-ink);}
.sidebar-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);padding:6px 10px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;}
.dot.offline{background:var(--gray-ink);}

.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
.topbar h1{margin:0;font-size:19px;font-weight:800;}
.topbar-sub{color:var(--text-2);font-size:12.5px;margin-top:2px;}
.view{padding:2px 20px 100px;flex:1;}

.bottomnav{display:none;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:16px;}
.grid{display:grid;gap:14px;}
.kpis{grid-template-columns:repeat(4,1fr);}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;}
.kpi .label{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.kpi .value{font-size:26px;font-weight:800;}
.kpi .sub{font-size:11.5px;color:var(--text-2);}
.two-col{grid-template-columns:1.3fr 1fr;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:15px;margin:0;font-weight:800;}
.section-title .hint{font-size:12px;color:var(--text-2);}

.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:14px 18px;font-size:14.5px;}
.btn:disabled{opacity:.45;pointer-events:none;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
.badge-match{background:var(--success-bg);color:var(--success);}
.badge-short{background:var(--danger-bg);color:var(--danger);}
.badge-extra{background:var(--warning-bg);color:var(--warning);}
.badge-none{background:var(--gray-bg);color:var(--gray-ink);}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--text-2);}
.field-row{display:grid;gap:10px;grid-template-columns:1fr 1fr;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--gray-bg);}
td.clickable{cursor:pointer;}

.swatch{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none;display:inline-block;vertical-align:-3px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);font-size:12.5px;font-weight:600;background:var(--card);}

.stickybar{position:sticky;z-index:15;background:var(--bg);padding:10px 0;}
.st-controls{display:flex;flex-wrap:wrap;gap:8px;top:calc(0px + env(safe-area-inset-top,0px));}
.st-controls select,.st-controls input{width:auto;min-width:110px;}
.searchbar{position:relative;flex:1;min-width:180px;}
.searchbar .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-2);}
.searchbar input{padding-left:34px;}

.codecard{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;}
.codecard:active{transform:scale(.995);}
.codecard.cc-done{background:var(--success-bg);}
.codecard .swatchgroup{display:flex;gap:-4px;}
.codecard .cc-main{flex:1;min-width:0;}
.codecard .cc-main b{font-size:14.5px;}
.codecard .cc-sub{color:var(--text-2);font-size:12px;margin-top:2px;}
.progressbar{height:6px;border-radius:99px;background:var(--gray-bg);overflow:hidden;margin-top:8px;}
.progressbar>span{display:block;height:100%;background:var(--primary);}

.bracket{display:grid;gap:8px;}
.bracket-row{display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:minmax(74px,1fr);}
.bcell{border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;background:var(--card);}
.bcell:active{transform:scale(.96);}
.bcell .bc-qty{font-size:17px;font-weight:800;font-family:'Manrope',sans-serif;}
.bcell .bc-sys{font-size:10.5px;color:var(--text-2);}
.bcell.st-match{border-color:var(--success);background:var(--success-bg);}
.bcell.st-short{border-color:var(--danger);background:var(--danger-bg);}
.bcell.st-extra{border-color:var(--warning);background:var(--warning-bg);}
.bcell-locked{cursor:default;opacity:.85;}
.bcell-locked:active{transform:none;}
.bracket-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--text-2);}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-backdrop.center{align-items:center;padding:16px;}
.modal-sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
.modal-backdrop.center .modal-sheet{border-radius:16px;}
.modal-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}

.keypad-display{text-align:center;padding:14px 0 8px;}
.keypad-display .qtybig{font-size:52px;font-weight:800;font-family:'Manrope',sans-serif;}
.keypad-display .sysline{color:var(--text-2);font-size:12.5px;margin-top:2px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px;}
.stepbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--gray-bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;}
.stepbtn:active{transform:scale(.94);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.keypad button{padding:14px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:18px;font-weight:700;cursor:pointer;}
.keypad button:active{background:var(--gray-bg);}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);}
:root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--card);color:var(--text);border:1px solid var(--border);}}
:root[data-theme="dark"] .toast{background:var(--card);color:var(--text);border:1px solid var(--border);}

.emptystate{text-align:center;padding:50px 20px;color:var(--text-2);}
.emptystate .icon-lg{margin:0 auto 10px;color:var(--text-2);}

.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.legend{display:flex;flex-direction:column;gap:8px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:none;}

.copybox{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow-y:auto;}

.tabs{display:flex;gap:6px;background:var(--gray-bg);padding:4px;border-radius:11px;width:fit-content;}
.tab{padding:7px 13px;border-radius:8px;border:none;background:transparent;font-weight:700;font-size:12.5px;color:var(--text-2);cursor:pointer;}
.tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow);}

.textarea-list{min-height:64px;}
.formgrid{display:flex;flex-direction:column;gap:12px;}

@media (max-width:860px){
  .sidebar{display:none;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .view{padding:2px 14px 96px;}
  .topbar{padding:14px 14px 8px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;
  }
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-2);font-size:10.5px;font-weight:700;padding:4px 8px;cursor:pointer;flex:1;}
  .bn-item.active{color:var(--primary);}
  .bracket-row{grid-auto-columns:minmax(64px,1fr);}
}
@media (min-width:861px){
  .st-controls{position:sticky;}
}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------------- version / update check ----------------
   Two real incidents this session were caused by a device silently running
   an old cached copy of this file (once still pointed at the old Firebase
   project). This makes that visible and self-healing instead of a mystery:
   the app periodically re-fetches its own HTML (bypassing cache) and
   compares the <meta name="app-version"> tag against the one it booted
   with; on a mismatch it shows a banner rather than staying silent. */
var APP_VERSION = (function(){
  var m = document.querySelector('meta[name="app-version"]');
  return m ? m.getAttribute('content') : 'unknown';
})();
var updateBannerShown = false;
function checkForAppUpdate(){
  if(updateBannerShown) return;
  if(typeof fetch !== 'function') return; // very old/embedded browser — skip rather than throw
  fetch(location.pathname + '?_cachebust=' + Date.now(), { cache:'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(html){
      var m = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
      if(m && m[1] && m[1] !== APP_VERSION){ updateBannerShown = true; showUpdateBanner(); }
    })
    .catch(function(){ /* offline, or host blocked the request — just try again later */ });
}
function showUpdateBanner(){
  var b = document.createElement('div');
  b.id = 'update-banner';
  b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#1F3A5F;color:#fff;'+
    'padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;'+
    'gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);';
  b.innerHTML = '<span>A newer version of Stock Take is available — this device is on an old copy.</span>'+
    '<button id="btn-update-now" style="background:#fff;color:#1F3A5F;border:none;border-radius:8px;'+
    'padding:6px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;">Update now</button>';
  document.body.appendChild(b);
  document.getElementById('btn-update-now').addEventListener('click', function(){
    var reload = function(){ location.href = location.pathname + '?v=' + Date.now(); };
    // Never lose a number that's sitting typed-in but not yet tapped
    // Save & Close/Next: this is the ONLY count data that could be "cut off"
    // by a reload — every quantity that's actually been saved is already
    // written to Firestore the moment you save it, reload or not. Save this
    // one first, then reload, so tapping Update never costs you that entry.
    var st = activeStocktake();
    if(qtyModalCtx && st){
      saveItem(st.id, qtyModalCtx.product, qtyModalCtx.value, state.ui.staff).then(reload).catch(reload);
    } else {
      reload();
    }
  });
}
// Clean up a cache-busting ?v= param left over from a forced update reload.
if(/[?&]v=\d+/.test(location.search)){
  try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){}
}

/* ---------------- icons ---------------- */
var ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',
  clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M9 12l2 2 4-4"/>',
  tag:'<path d="M11 3H4v7l10 10 7-7L11 3z"/><circle cx="7.4" cy="7.4" r="1.1" fill="currentColor" stroke="none"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  clock:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 2"/>',
  bars:'<path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12c0-.4 0-.8-.1-1.2l1.9-1.5-2-3.4-2.2.9c-.6-.5-1.3-.9-2-1.2L14.2 3H9.8l-.4 2.6c-.7.3-1.4.7-2 1.2l-2.2-.9-2 3.4L5.1 11c-.1.4-.1.8-.1 1.2s0 .8.1 1.2l-1.9 1.6 2 3.4 2.2-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.2.9 2-3.4-1.9-1.6c.1-.4.1-.8.1-1.2z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>',
  check:'<path d="M5 13l4 4 10-10"/>',
  minus:'<path d="M5 12h14"/>',
  dots:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  trash:'<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>',

/* ---------------- local fallback store (mimics db capability subset) ---------------- */
function makeLocalDB(){
  var LSKEY = 'vhm_stocktake_v1';
  function loadAll(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch(e){ return {}; } }
  function saveAll(d){ try{ localStorage.setItem(LSKEY, JSON.stringify(d)); }catch(e){} }
  var bus = {};
  function emit(colPath){
    var all = loadAll();
    (bus[colPath]||[]).forEach(function(fn){
      var items = Object.keys(all[colPath]||{}).map(function(id){ return {id:id, exists:true, data:function(){return all[colPath][id];}}; });
      fn({ docs: items, size: items.length, empty: items.length===0, docChanges:function(){return [];} });
    });
    var docBus = bus['doc:'+colPath];
  }
  function docRef(path){
    var parts = path.split('/'); var id = parts.pop(); var colPath = parts.join('/');
    return {
      id:id, path:path,
      get: function(){ var all=loadAll(); var d=(all[colPath]||{})[id]; return Promise.resolve({id:id, exists: d!==undefined, data:function(){return d;}}); },
      set: function(data){ var all=loadAll(); all[colPath]=all[colPath]||{}; all[colPath][id]=JSON.parse(JSON.stringify(data)); saveAll(all); emit(colPath); (bus['doc:'+path]||[]).forEach(function(fn){fn({id:id,exists:true,data:function(){return all[colPath][id];}});}); return Promise.resolve(); },
      update: function(data){ var all=loadAll(); all[colPath]=all[colPath]||{}; var cur=all[colPath][id]||{}; var merged=Object.assign({},cur,data); all[colPath][id]=merged; saveAll(all); emit(colPath); (bus['doc:'+path]||[]).forEach(function(fn){fn({id:id,exists:true,data:function(){return merged;}});}); return Promise.resolve(); },
      delete: function(){ var all=loadAll(); if(all[colPath]) delete all[colPath][id]; saveAll(all); emit(colPath); return Promise.resolve(); },
      onSnapshot: function(next){ var all=loadAll(); var d=(all[colPath]||{})[id]; next({id:id, exists:d!==undefined, data:function(){return d;}}); bus['doc:'+path]=bus['doc:'+path]||[]; bus['doc:'+path].push(next); return function(){ var i=bus['doc:'+path].indexOf(next); if(i>-1) bus['doc:'+path].splice(i,1); }; },
      collection: function(sub){ return collRef(path+'/'+sub); }
    };
  }
  function collRef(path){
    var q = { _filters:[] };
    function build(extra){ var nq={_filters:q._filters.slice()}; Object.assign(nq,extra); return wrap(nq); }
    function wrap(qq){
      return {
        path:path,
        doc: function(id){ return docRef(path+'/'+(id||uid('d'))); },
        add: function(data){ var r=docRef(path+'/'+uid('d')); return r.set(data).then(function(){return r;}); },
        where: function(f,op,v){ return build({_filters:(qq._filters||[]).concat([{f:f,op:op,v:v}])}); },
        orderBy: function(f,dir){ return Object.assign(build({}), {_orderBy:f,_dir:dir||'asc'}); },
        limit: function(n){ return Object.assign(build({}), {_limit:n}); },
        get: function(){
          var all=loadAll(); var raw = all[path]||{};
          var docs = Object.keys(raw).map(function(id){ return {id:id, exists:true, data:function(){return raw[id];}}; });
          (qq._filters||[]).forEach(function(fl){
            docs = docs.filter(function(d){
              var val = d.data()[fl.f];
              if(fl.op==='==') return val===fl.v;
              if(fl.op==='!=') return val!==fl.v;
              if(fl.op==='in') return (fl.v||[]).indexOf(val)>-1;
              return true;
            });
          });
          if(qq._orderBy){ docs.sort(function(a,b){ var av=a.data()[qq._orderBy],bv=b.data()[qq._orderBy]; if(av<bv) return qq._dir==='desc'?1:-1; if(av>bv) return qq._dir==='desc'?-1:1; return 0; }); }
          if(qq._limit) docs = docs.slice(0,qq._limit);
          return Promise.resolve({docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}});
        },
        onSnapshot: function(next){
          var fn = function(){ wrap(qq).get().then(next); };
          fn();
          bus[path]=bus[path]||[]; bus[path].push(fn);
          return function(){ var i=bus[path].indexOf(fn); if(i>-1) bus[path].splice(i,1); };
        }
      };
    }
    return wrap(q);
  }
  return { doc:docRef, collection:collRef, __local:true };
}

function computeStatus(sys,phys){
  if(phys===null||phys===undefined) return 'NOT COUNTED';
  var d = phys-sys;
  if(d===0) return 'MATCH';
  if(d<0) return 'SHORT';
  return 'EXTRA';
}

function activeStocktake(){ return state.stocktakes.find(function(s){return s.id===state.ui.activeStocktakeId;}); }
// Multiple staff can each have their own stock take running at once (e.g.
// David on shirts, Kin on pants) — "the" active one for THIS phone is
// whichever in-progress stock take belongs to state.ui.staff, not just any
// in-progress record. Called after every stocktakes load/refresh and
// whenever state.ui.staff changes, so switching identity on a shared phone
// immediately shows that person's own session (or the Start screen, if they
// don't have one going).
function resolveMyActiveStocktake(){
  var mine = state.stocktakes.find(function(s){ return s.status==='in_progress' && s.staff===state.ui.staff; });
  state.ui.activeStocktakeId = mine ? mine.id : null;
}
// Soft, read-only awareness — not a lock — that someone else is also
// currently counting this code in their own in-progress stock take. Costs
// nothing extra: it's computed from data already loaded (state.items,
// state.stocktakes), no additional reads/writes, so it stays cheap even
// with several staff working in parallel.
function otherActiveCounterFor(code, st){
  var mineId = st && st.id;
  var others = null;
  for(var i=0;i<state.items.length;i++){
    var it = state.items[i];
    if(it.code!==code || it.stocktake_id===mineId) continue;
    var s = state.stocktakes.find(function(x){ return x.id===it.stocktake_id; });
    if(s && s.status==='in_progress'){ others = s; break; }
  }
  return others ? others.staff : null;
}

function recomputeStocktakeTotals(stId){
  var items = itemsForStocktake(stId);
  var counted=0, short=0, extra=0, match=0, shortQty=0, extraQty=0;
  items.forEach(function(it){
    if(it.status!=='NOT COUNTED'){ counted++; }
    if(it.status==='SHORT'){ short++; shortQty += (it.system_quantity-it.physical_quantity); }
    if(it.status==='EXTRA'){ extra++; extraQty += (it.physical_quantity-it.system_quantity); }
    if(it.status==='MATCH'){ match++; }
  });
  var totalVariants = 0;
  var st = state.stocktakes.find(function(s){return s.id===stId;});
  if(st){
    var vs = state.products.filter(function(p){ return st.category==='all' ? true : p.category===st.category; });
    totalVariants = vs.length;
  }
  return { totalProducts:totalVariants, counted:counted, notCounted:Math.max(totalVariants-counted,0), match:match, short:short, extra:extra, shortQty:shortQty, extraQty:extraQty };
}

/* ---------------- KPIs ---------------- */
function computeKPIs(){
  var totalProducts = state.products.length;
  var totalQty = state.products.reduce(function(a,p){return a+(p.system_quantity||0);},0);
  var totalValue = state.products.reduce(function(a,p){return a+(p.system_quantity||0)*(p.unit_cost||0);},0);
  var today = todayISO();
  var itemsToday = state.items.filter(function(i){ return (i.counted_at||'').slice(0,10)===today; });
  var countedTodayProducts = {}; itemsToday.forEach(function(i){countedTodayProducts[i.product_id]=1;});
  var countedToday = Object.keys(countedTodayProducts).length;
  var discrepancies = state.items.filter(function(i){ return i.status==='SHORT'||i.status==='EXTRA'; });
  var discToday = itemsToday.filter(function(i){return i.status==='SHORT'||i.status==='EXTRA';}).length;
  var lowStock = state.products.filter(function(p){ return (p.system_quantity||0)>0 && (p.system_quantity||0)<=3; }).length;
  var outStock = state.products.filter(function(p){ return (p.system_quantity||0)<=0; }).length;
  var completed = state.stocktakes.filter(function(s){return s.status==='completed';}).sort(function(a,b){return (b.completed_at||0)-(a.completed_at||0);});
  var lastDate = completed.length ? completed[0].date : null;
  return { totalProducts:totalProducts, totalQty:totalQty, totalValue:totalValue, countedToday:countedToday, discrepancies:discrepancies.length, discToday:discToday, lowStock:lowStock, outStock:outStock, lastDate:lastDate };
}

function categoryStats(rangeItems){
  var cats = Object.keys(state.settings.categories);
  return cats.map(function(k){
    var its = rangeItems.filter(function(i){return i.category===k;});
    var counted = its.filter(function(i){return i.status!=='NOT COUNTED';}).length;
    var short = its.filter(function(i){return i.status==='SHORT';}).length;
    var extra = its.filter(function(i){return i.status==='EXTRA';}).length;
    var match = its.filter(function(i){return i.status==='MATCH';}).length;
    var value = state.products.filter(function(p){return p.category===k;}).reduce(function(a,p){return a+(p.system_quantity||0)*(p.unit_cost||0);},0);
    return {key:k, label:catMeta(k).label, counted:counted, short:short, extra:extra, match:match, value:value};
  });
}

function rangeStart(rangeKey, custom){
  var now = new Date();
  if(rangeKey==='today'){ return todayISO(); }
  if(rangeKey==='week'){ var d=new Date(now); d.setDate(d.getDate()-6); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  if(rangeKey==='month'){ var d2=new Date(now); d2.setDate(d2.getDate()-29); return d2.getFullYear()+'-'+pad2(d2.getMonth()+1)+'-'+pad2(d2.getDate()); }
  if(rangeKey==='custom' && custom) return custom;
  return '2000-01-01';
}
function itemsInRange(rangeKey,custom){
  var start = rangeStart(rangeKey,custom);
  return state.items.filter(function(i){ return (i.counted_at||'').slice(0,10) >= start; });
}

/* ---------------- Firestore adapter ----------------
   Wraps the Firebase v9 modular SDK behind the exact same
   {doc(path), collection(path)} interface as makeLocalDB(), so every
   render/event-handler function above works unmodified whether the
   page is backed by Firestore or the local fallback. */
function makeFirebaseDB(fsdb, mod){
  function wrapDocSnap(snap){ return { id:snap.id, exists:snap.exists(), data:function(){ return snap.data(); } }; }
  function wrapQuerySnap(qs){
    var docs = qs.docs.map(function(d){ return { id:d.id, exists:true, data:function(){ return d.data(); } }; });
    return { docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){ return []; } };
  }
  function docRefFromNative(ref){
    return {
      id: ref.id, path: ref.path,
      get: function(){ return mod.getDoc(ref).then(wrapDocSnap); },
      set: function(data){ return mod.setDoc(ref, data); },
      update: function(data){ return mod.updateDoc(ref, data); },
      delete: function(){ return mod.deleteDoc(ref); },
      onSnapshot: function(next, error){ return mod.onSnapshot(ref, function(snap){ next(wrapDocSnap(snap)); }, error); },
      collection: function(sub){ return collRef(ref.path+'/'+sub, []); }
    };
  }
  function collRef(path, constraints){
    constraints = constraints || [];
    var colRef = mod.collection(fsdb, path);
    function buildQuery(){ return constraints.length ? mod.query.apply(null, [colRef].concat(constraints)) : colRef; }
    return {
      path: path,
      doc: function(id){ var ref = id ? mod.doc(fsdb, path+'/'+id) : mod.doc(colRef); return docRefFromNative(ref); },
      add: function(data){ return mod.addDoc(colRef, data).then(docRefFromNative); },
      where: function(f,op,v){ return collRef(path, constraints.concat([mod.where(f,op,v)])); },
      orderBy: function(f,dir){ return collRef(path, constraints.concat([mod.orderBy(f, dir||'asc')])); },
      limit: function(n){ return collRef(path, constraints.concat([mod.limit(n)])); },
      get: function(){ return mod.getDocs(buildQuery()).then(wrapQuerySnap); },
      onSnapshot: function(next, error){ return mod.onSnapshot(buildQuery(), function(qs){ next(wrapQuerySnap(qs)); }, error); }
    };
  }
  return { doc: function(path){ return docRefFromNative(mod.doc(fsdb, path)); }, collection: function(path){ return collRef(path, []); } };
}
window.__vhmMakeFirebaseAdapter = makeFirebaseDB;

var unsub = [];
var booted = false;
function bootWithDb(db, online, storage){
  if(booted) return; booted = true;
  state.db = db || makeLocalDB();
  state.online = !!online;
  state.storage = storage || null;
  renderShell();
  ensureSeed().then(function(){
    var remembered = getRememberedStaff();
    if(remembered && state.settings.staff.indexOf(remembered)>-1) state.ui.staff = remembered;
  }).then(loadAllData).then(function(){ if(state.online){ flushPendingStatus(); flushPendingItems(); } }).catch(function(err){
    // Firestore reachable but rejecting calls (rules not published yet,
    // wrong project, offline mid-boot) — don't leave the page stuck on a
    // blank shell. Drop to on-device storage so it's still usable, and
    // say why in Settings rather than failing silently.
    console.error('VHM Stock Take: Firestore calls failed, falling back to on-device storage.', err);
    booted = false;
    bootWithDb(null, false, null);
  });
}
window.__vhmBoot = bootWithDb;
// Safety net: if the Firebase module script below never calls back
// (blocked network, ad blocker, offline), fall back to on-device storage
// after a few seconds rather than leaving the page stuck loading.
setTimeout(function(){ bootWithDb(null, false, null); }, 6000);

function ensureSeed(){
  var settingsRef = state.db.collection('vhm_stocktake_meta').doc('settings');
  return settingsRef.get().then(function(snap){
    if(snap.exists){
      var d = snap.data();
      state.settings = {
        categories: d.categories || DEFAULT_CATEGORIES,
        colors: d.colors || DEFAULT_COLORS,
        staff: d.staff || DEFAULT_STAFF,
        warehouses: d.warehouses || DEFAULT_WAREHOUSES
      };
      state.ui.staff = state.settings.staff[0];
      state.ui.warehouse = state.settings.warehouses[0];
      // Settings already exist, so this workspace has been set up before —
      // never auto-reseed here. An empty products collection at this point
      // means someone deliberately cleared it (Settings > Clear all data),
      // and it should stay empty until they choose "Load sample data".
      return null;
    } else {
      // True first-ever launch of this workspace: settings doc doesn't
      // exist yet, so there's no real data to protect. Seed once.
      return settingsRef.set({categories:DEFAULT_CATEGORIES, colors:DEFAULT_COLORS, staff:DEFAULT_STAFF, warehouses:DEFAULT_WAREHOUSES}).then(function(){
        return seedProducts();
      });
    }
  });
}
function seedProducts(){

    {code:'E205', name:'Overshirt E205', category:'shirts', subcategory:'Overshirt', cost:8, price:19, colors:['wht','blk','khk'], sizes:['S','M','L','XL','2XL']},

    {code:'V220', name:'Straight Jeans V220', category:'pants', subcategory:'Jeans', cost:9, price:22, colors:['blk','ink'], sizes:['28','30','32','34','36','38']},
    {code:'V310', name:'Cargo Jogger V310', category:'pants', subcategory:'Jogger', cost:7, price:17, colors:['khk','blk','gry'], sizes:['30','32','34','36']},

    {code:'T012', name:'Snapback Cap T012', category:'accessories', subcategory:'Cap', cost:2.5, price:7, colors:['blk','wht','red'], sizes:['Free Size']}
  ];
  var ops = [];
  var col = state.db.collection('vhm_stocktake_products');
  seedCodes.forEach(function(sc){
    sc.colors.forEach(function(cc){
      sc.sizes.forEach(function(sz){
        var id = sc.code+'_'+slug(sz)+'_'+cc;

        ops.push(col.doc(id).set({

  return ops.reduce(function(p,op){ return p.then(function(){return op;}); }, Promise.resolve());

/* One-time loads instead of live onSnapshot listeners, for the bulk
   collections (products/stocktakes/items) — several staff CAN now run their
   own stock takes in parallel, but each is still mainly a single person
   recording a count and exporting it, not several people watching the same
   session update live, so there's no need for a permanent connection here
   (every open listener re-counts as reads every time it fires — this is
   also why Stock Take runs on its own Firebase project, vhm-data, instead of
   sharing vhm-menu with the other tools). Local writes update state.*
   optimistically (see saveItem, submitNewCode, etc.), and "Refresh" (sidebar
   + Settings) pulls the latest on demand — e.g. if another staff phone made
   changes since this page loaded. (vhm_stocktake_code_status is the one
   exception kept live — see watchCodeStatus.) */
function loadAllData(){
  return Promise.all([
    state.db.collection('vhm_stocktake_products').get().then(function(qs){
      state.products = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    }),
    state.db.collection('vhm_stocktake_stocktakes').orderBy('created_at','desc').limit(200).get().then(function(qs){
      state.stocktakes = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      resolveMyActiveStocktake();
    }),
    state.db.collection('vhm_stocktake_items').limit(2000).get().then(function(qs){
      state.items = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    }),
    // Per-code "Done" status — global, not tied to any one stock take. Once a
    // code is fully counted it's marked done here and disappears from every
    // stock take's counting list (current and future) until someone presses
    // "Activate recount" on the Products page. Doc id = product code. This
    // is the one collection kept LIVE (see watchCodeStatus) rather than a
    // one-time read, so if it's ever counted on two phones at once, one
    // marking a code Done shows up on the other within about a second
    // instead of only after that phone next hits Refresh — the main window
    // for the same code getting double-counted across two stock takes.
    new Promise(function(resolve){ watchCodeStatus(resolve); })
  ]).then(function(){ scheduleRender(); });
}
var codeStatusUnsub = null;
function watchCodeStatus(onFirst){
  if(codeStatusUnsub){ if(onFirst) onFirst(); return; } // already watching
  var first = true;
  codeStatusUnsub = state.db.collection('vhm_stocktake_code_status').onSnapshot(function(qs){
    var fresh = {};
    qs.docs.forEach(function(d){ fresh[d.id] = d.data(); });
    state.codeStatus = fresh;
    if(first){ first = false; if(onFirst) onFirst(); }
    else scheduleRender();
  }, function(err){
    console.error('Code status live sync failed — falling back to Refresh-only updates', err);
    state.codeStatus = state.codeStatus || {};
    if(first){ first = false; if(onFirst) onFirst(); }
  });
}
function refreshAllData(){
  toast('Refreshing…');
  if(state.online){ flushPendingStatus(); flushPendingItems(); }
  return loadAllData().then(function(){ toast('Up to date'); });
}

/* ---------------- writes ---------------- */
/* Same idea as the code-status retry queue below, but for the actual
   counted quantities. A code can be counted, closed, and then left alone
   for a week or a month before anyone opens it again — so a dropped write
   can't rely on someone noticing and re-entering it later; there might be
   nothing left on screen to prompt that. Every item save is queued here
   until Firestore actually confirms it, and the queue is flushed
   automatically (on reconnect, on load, and on "Refresh") instead of
   needing a person to remember to press a sync button per code. */
var PENDING_ITEMS_KEY = 'vhm_stocktake_pending_items_v1';
function readPendingItems(){ try { return JSON.parse(localStorage.getItem(PENDING_ITEMS_KEY)||'{}'); } catch(e){ return {}; } }
function writePendingItems(q){ try { localStorage.setItem(PENDING_ITEMS_KEY, JSON.stringify(q)); } catch(e){} }
function queuePendingItem(id, stId, payload){ var q=readPendingItems(); q[id]={stId:stId, payload:payload}; writePendingItems(q); }
function clearPendingItem(id){ var q=readPendingItems(); delete q[id]; writePendingItems(q); }
function pendingItemCount(){ return Object.keys(readPendingItems()).length; }
// Total count shown to the user, combining both retry queues (item saves +
// code-status/Done writes) — one number, so "is everything synced?" has one
// answer instead of two separate ones to check.
function pendingSyncTotal(){ return pendingItemCount() + Object.keys(readPendingStatusQueue()).length; }
function flushPendingItems(){
  var q = readPendingItems();
  var ids = Object.keys(q);
  if(!ids.length) return Promise.resolve();
  var touched = {};
  return Promise.all(ids.map(function(id){
    var entry = q[id];
    return state.db.collection('vhm_stocktake_items').doc(id).set(entry.payload).then(function(){
      clearPendingItem(id);
      touched[entry.stId] = true;
    }).catch(function(){ /* still offline — leave queued, try again next time */ });
  })).then(function(){
    Object.keys(touched).forEach(function(stId){ refreshStocktakeTotals(stId); });
    scheduleRender();
  });
}
if(typeof window!=='undefined') window.addEventListener('online', flushPendingItems);

function saveItem(stId, product, physicalQty, staff){
  var status = computeStatus(product.system_quantity, physicalQty);
  var id = stId+'__'+product.id;
  var payload = {
    stocktake_id: stId, product_id: product.id, code: product.code, name:product.name,
    size: product.size, color: product.color, category: product.category,
    system_quantity: product.system_quantity, physical_quantity: physicalQty,
    difference: physicalQty - product.system_quantity, status: status,
    counted_at: new Date().toISOString(), counted_by: staff
  };
  // optimistic local update
  var idx = state.items.findIndex(function(i){return i.id===id;});
  if(idx>-1) state.items[idx] = Object.assign({id:id},payload); else state.items.push(Object.assign({id:id},payload));
  state.ui.lastSaved = Date.now();
  return state.db.collection('vhm_stocktake_items').doc(id).set(payload).then(function(){
    clearPendingItem(id);
    return refreshStocktakeTotals(stId);
  }).catch(function(e){
    // Don't strand this count only in memory (a refresh would lose it for
    // good with the server never having seen it), and don't block closing
    // the modal / moving to the next cell on a network that might stay down
    // a while — queue it, tell the user plainly, and let flushPendingItems
    // retry it automatically.
    console.error('Could not sync item '+id, e);
    queuePendingItem(id, stId, payload);
    toast(product.code+': saved on this device, will sync when back online', 4000);
  });
}
function refreshStocktakeTotals(stId){
  var totals = recomputeStocktakeTotals(stId);
  var idx = state.stocktakes.findIndex(function(s){return s.id===stId;});
  if(idx>-1) state.stocktakes[idx] = Object.assign({}, state.stocktakes[idx], {totals:totals});
  return state.db.collection('vhm_stocktake_stocktakes').doc(stId).update({totals:totals}).catch(function(){});
}
// Guards against two stock takes running at once, which is how the same
// code ends up counted twice under two different stocktake_ids: e.g. this
// phone's in-memory list is stale (someone started one from another phone,
// or a while ago on this one, and this device hasn't refreshed since), so
// "Start Stock Take" would otherwise happily create a second one. Checks
// Firestore directly rather than trusting state.stocktakes, since that's
// exactly the copy that can be stale here.
// Staff members work in parallel now, each with their own stock take, so
// this only guards against the same PERSON accidentally starting a second
// one of their own (e.g. this phone's in-memory list is stale — someone
// started theirs from another phone moments ago, or a while back on this
// one, and it hasn't been refreshed since). It never blocks a different
// staff member from starting theirs.
function confirmNoOtherActiveStocktake(onProceed){
  state.db.collection('vhm_stocktake_stocktakes').where('status','==','in_progress').where('staff','==',state.ui.staff).get().then(function(qs){
    var existing = qs.docs[0];
    if(!existing){ onProceed(); return; }
    var d = existing.data();
    if(existing.id === state.ui.activeStocktakeId){ onProceed(); return; } // it's already this device's own active one
    openConfirmModal(
      'You already have a stock take in progress',
      (d.number||'A stock take')+' ('+(d.date||'')+') is still open under your name. Starting a new one instead of continuing it risks the same code getting counted twice, once in each. Continue that one instead?',
      function(){
        state.ui.activeStocktakeId = existing.id;
        if(state.stocktakes.findIndex(function(s){return s.id===existing.id;})===-1){
          state.stocktakes.unshift(Object.assign({id:existing.id}, d));
        }
        renderPage();
      }
    );
  }).catch(function(){ onProceed(); }); // offline/local mode — nothing else to check against
}
function startStocktake(category){
  var today = todayISO();
  var seq = state.stocktakes.filter(function(s){return s.date===today;}).length + 1;
  var num = 'ST-'+today.replace(/-/g,'')+'-'+pad2(seq);
  var payload = {
    number:num, date:today, staff:state.ui.staff, warehouse:state.ui.warehouse, category:category||'all',
    status:'in_progress', created_at: Date.now(), completed_at:null,
    totals:{totalProducts:0,counted:0,notCounted:0,match:0,short:0,extra:0,shortQty:0,extraQty:0}
  };
  return state.db.collection('vhm_stocktake_stocktakes').add(payload).then(function(ref){
    state.ui.activeStocktakeId = ref.id;
    state.stocktakes.unshift(Object.assign({id:ref.id},payload));
    scheduleRender();
    return ref.id;
  });
}
function completeStocktake(stId){
  return refreshStocktakeTotals(stId).then(function(){
    return state.db.collection('vhm_stocktake_stocktakes').doc(stId).update({status:'completed', completed_at:Date.now()});
  }).then(function(){
    var idx = state.stocktakes.findIndex(function(s){return s.id===stId;});
    if(idx>-1) state.stocktakes[idx] = Object.assign({}, state.stocktakes[idx], {status:'completed', completed_at:Date.now()});
    state.ui.activeStocktakeId = null;
    scheduleRender();
  });
}

/* ---------------- charts (inline svg) ---------------- */
function donutChart(segments, size){
  size = size||150;
  var r = size/2 - 12, c = size/2;
  var total = segments.reduce(function(a,s){return a+s.value;},0) || 1;
  var circ = 2*Math.PI*r;
  var offset = 0;
  var circles = segments.map(function(s){
    var frac = s.value/total;
    var dash = frac*circ;
    var el = '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="16" stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+c+' '+c+')"/>';
    offset += dash;
    return el;
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--gray-bg)" stroke-width="16"/>'+
    circles+
    '<text x="'+c+'" y="'+(c-3)+'" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="22" fill="var(--text)">'+total+'</text>'+
    '<text x="'+c+'" y="'+(c+15)+'" text-anchor="middle" font-size="10.5" fill="var(--text-2)">items</text>'+
  '</svg>';
}

function groupedBarChart(rows, keys, colors, width, height){
  width = width||520; height = height||220;
  var padL=34, padB=26, padT=12, padR=10;
  var innerW = width-padL-padR, innerH = height-padT-padB;
  var max = 1;
  rows.forEach(function(r){ keys.forEach(function(k){ if(r[k]>max) max=r[k]; }); });
  max = Math.ceil(max*1.15) || 1;
  var groupW = innerW/rows.length;
  var barW = Math.min(18, (groupW-14)/keys.length);
  var bars='', labels='', gridlines='';
  var steps=4;
  for(var g=0; g<=steps; g++){
    var val = Math.round(max/steps*g);
    var y = padT+innerH-(val/max)*innerH;
    gridlines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(width-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    gridlines += '<text x="4" y="'+(y+3)+'" font-size="9.5" fill="var(--text-2)">'+val+'</text>';
  }
  rows.forEach(function(r,i){
    var gx = padL + i*groupW + (groupW - barW*keys.length)/2;
    keys.forEach(function(k,ki){
      var v = r[k]||0;
      var h = (v/max)*innerH;
      var x = gx + ki*barW;
      var y = padT+innerH-h;
      bars += '<rect x="'+x+'" y="'+y+'" width="'+(barW-3)+'" height="'+Math.max(h,0)+'" rx="3" fill="'+colors[ki]+'"/>';
    });
    labels += '<text x="'+(padL+i*groupW+groupW/2)+'" y="'+(height-6)+'" text-anchor="middle" font-size="10.5" fill="var(--text-2)">'+esc(r.label)+'</text>';
  });
  return '<svg width="100%" viewBox="0 0 '+width+' '+height+'" style="max-width:'+width+'px">'+gridlines+bars+labels+'</svg>';
}

function sparkLine(values, width, height){
  width=width||520; height=height||120;
  var padL=30,padR=10,padT=14,padB=20;
  var innerW=width-padL-padR, innerH=height-padT-padB;
  var max = Math.max.apply(null, values.concat([1]));
  var min = Math.min.apply(null, values.concat([0]));
  if(max===min) max=min+1;
  var pts = values.map(function(v,i){
    var x = padL + (values.length===1?0:(i/(values.length-1))*innerW);
    var y = padT + innerH - ((v-min)/(max-min))*innerH;
    return [x,y];
  });
  var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area = path + ' L'+pts[pts.length-1][0].toFixed(1)+' '+(padT+innerH)+' L'+pts[0][0].toFixed(1)+' '+(padT+innerH)+' Z';
  var dots = pts.map(function(p,i){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.4)+'" fill="var(--primary)"/>'; }).join('');
  return '<svg width="100%" viewBox="0 0 '+width+' '+height+'" style="max-width:'+width+'px">'+
    '<path d="'+area+'" fill="var(--primary-tint)" stroke="none"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--primary)" stroke-width="2.4"/>'+
    dots+
  '</svg>';
}

/* ---------------- Stock Take ---------------- */
function renderStockTake(){
  var st = activeStocktake();
  if(!st) return renderStartStocktake();
  return renderActiveStocktake(st);
}
function renderStartStocktake(){
  var staffOpts = state.settings.staff.map(function(s){return '<option '+(s===state.ui.staff?'selected':'')+'>'+esc(s)+'</option>';}).join('');
  var whOpts = state.settings.warehouses.map(function(w){return '<option '+(w===state.ui.warehouse?'selected':'')+'>'+esc(w)+'</option>';}).join('');
  var catOpts = '<option value="all">All categories</option>'+Object.keys(state.settings.categories).map(function(k){return '<option value="'+k+'">'+catMeta(k).label+'</option>';}).join('');
  return '<div class="card pad" style="max-width:460px;margin:20px auto 0;">'+
    '<div style="font-weight:800;font-size:16px;margin-bottom:4px;">Start a stock take</div>'+

    '</div>'+

}
function field(label,inner){ return '<label class="field">'+label+inner+'</label>'; }

// Is every visible cell for this code filled in for THIS SPECIFIC stock take?
// This is the per-session completeness check — see isCodeGloballyDone below
// for the persistent, cross-stock-take Done status staff actually see.
function isCodeDone(code, st){
  // Uses the same deduped color/size list the bracket grid actually shows
  // (orderedVariants), not the raw product list — a code can have more than
  // one product doc for the same color+size (leftover duplicates from data
  // edits), and the bracket only ever shows/lets you fill one cell per
  // color+size. Counting against the raw list meant a code could have every
  // visible cell filled in and still never register as Done.
  var variants = orderedVariants(code);
  if(!variants.length) return false;
  var counted = variants.filter(function(v){ var it=itemFor(st.id,v.id); return it && it.status!=='NOT COUNTED'; }).length;
  return counted===variants.length;
}

// Persistent, global Done flag for a code — set once, it hides the code from
// every stock take's counting list (the current one and any future one),
// not just the session that finished it. Cleared only by "Activate recount"
// on the Products page.
function isCodeGloballyDone(code){
  var s = state.codeStatus[code];
  return !!(s && s.needsRecount===false);
}
// A Done code disappears from every OTHER stock take's counting list (the
// whole point of the global flag), but staying visible — as a "Done" card,
// read-only — in the very session that just finished it, so counting it and
// closing the popup doesn't make it look like it vanished/lost its data.
// It only becomes truly hidden here once you move on to a different stock
// take (this one completed, or a fresh one started).
function isCodeHiddenFromStocktake(code, st){
  if(!isCodeGloballyDone(code)) return false;
  var s = state.codeStatus[code];
  return !st || s.doneStocktakeId !== st.id;
}
/* Small localStorage retry queue, just for code-status writes (Done /
   recount). Keeps the Firestore client itself plain and fast (no IndexedDB
   persistence — see the boot script below for why) while still making sure
   a status write dropped mid-signal-drop isn't lost for good: it's queued
   here — localStorage is synchronous and effectively instant, so this adds
   no perceptible delay — and retried on the next load, the next "Refresh",
   or the next time the browser fires an online event. */
var PENDING_STATUS_KEY = 'vhm_stocktake_pending_status_v1';
function readPendingStatusQueue(){ try { return JSON.parse(localStorage.getItem(PENDING_STATUS_KEY)||'{}'); } catch(e){ return {}; } }
function writePendingStatusQueue(q){ try { localStorage.setItem(PENDING_STATUS_KEY, JSON.stringify(q)); } catch(e){} }
function queuePendingStatus(code, data){ var q=readPendingStatusQueue(); q[code]=data; writePendingStatusQueue(q); }
function clearPendingStatus(code){ var q=readPendingStatusQueue(); delete q[code]; writePendingStatusQueue(q); }
function syncCodeStatus(code, data, failMsg){
  return state.db.collection('vhm_stocktake_code_status').doc(code).set(data).then(function(){
    clearPendingStatus(code);
  }).catch(function(e){
    console.error('Could not sync status for '+code, e);
    queuePendingStatus(code, data);
    if(failMsg) toast(failMsg, 5000);
  });
}
function statusTimestamp(s){ return Math.max((s&&s.doneAt)||0, (s&&s.recountRequestedAt)||0); }
function flushPendingStatus(){
  var q = readPendingStatusQueue();
  Object.keys(q).forEach(function(code){
    var queued = q[code];
    var current = state.codeStatus[code];
    // The live listener (watchCodeStatus) usually means state.codeStatus is
    // already fresh by the time this runs. If something newer than our
    // queued write already landed on the server — e.g. this code was
    // recounted from another phone while this one was offline — drop the
    // stale queued write instead of clobbering the newer one.
    if(current && statusTimestamp(current) > statusTimestamp(queued)){
      clearPendingStatus(code);
      return;
    }
    state.codeStatus[code] = queued;
    state.db.collection('vhm_stocktake_code_status').doc(code).set(queued).then(function(){
      clearPendingStatus(code);
      scheduleRender();
    }).catch(function(){ /* still offline — leave queued, try again next time */ });
  });
  if(Object.keys(q).length) scheduleRender();
}
if(typeof window!=='undefined') window.addEventListener('online', flushPendingStatus);

function markCodeDoneGlobally(code, stId){
  if(isCodeGloballyDone(code)) return; // already marked, don't spam writes
  var data = { needsRecount:false, doneAt:Date.now(), doneStocktakeId:stId };
  state.codeStatus[code] = data; // optimistic
  syncCodeStatus(code, data, code+": Done status didn't sync (offline?) — it'll retry automatically");
  notifyTelegram('✅ '+code+' finished counting by '+state.ui.staff+' — needs transfer to VRich/Popok.');
}
// VRich/Popok transfer ticks — set when an admin has moved this code's
// counted quantity over to that other system. A re-count means the number
// may be about to change again, so activateRecount() below clears both
// ticks: an old tick would otherwise keep claiming a quantity that's no
// longer confirmed accurate.
function isTransferTicked(code, platform){
  var s = state.codeStatus[code];
  return !!(s && s[platform+'Done']);
}
function codeNeedsTransfer(code){
  if(!isCodeGloballyDone(code)) return false;
  return !isTransferTicked(code,'vrich') || !isTransferTicked(code,'popok');
}
function needsTransferCount(){
  var seen = {}, n = 0;
  state.products.forEach(function(p){
    if(seen[p.code]) return; seen[p.code]=1;
    if(codeNeedsTransfer(p.code)) n++;
  });
  return n;
}
function toggleTransferTick(code, platform){
  var data = Object.assign({}, state.codeStatus[code]||{});
  data[platform+'Done'] = !data[platform+'Done'];
  state.codeStatus[code] = data; // optimistic
  syncCodeStatus(code, data, code+': '+platform+' tick didn\'t sync (offline?) — it\'ll retry automatically');
  renderPage();
}
function activateRecount(code){
  var data = Object.assign({}, state.codeStatus[code]||{}, { needsRecount:true, recountRequestedAt:Date.now(), vrichDone:false, popokDone:false });
  state.codeStatus[code] = data; // optimistic

  // If the code was marked Done earlier in the SAME still-open stock take,
  // its old counted quantities are still sitting in state.items for that
  // stocktake_id. Without clearing them, the code unlocks (it's no longer
  // globally Done) but still looks untouched here — the card still reads
  // "Done"/fully counted and the bracket still shows the old numbers, so it
  // only actually looks like it needs recounting once you complete this
  // stock take and start a new one. Clearing them here makes the recount
  // take effect immediately, in the stock take you're already in.
  var st = activeStocktake();
  if(st){
    var staleItems = orderedVariants(code).map(function(v){ return itemFor(st.id, v.id); }).filter(Boolean);
    staleItems.forEach(function(it){
      var idx = state.items.findIndex(function(i){ return i.id===it.id; });
      if(idx>-1) state.items.splice(idx,1);
      state.db.collection('vhm_stocktake_items').doc(it.id).delete().catch(function(){});
    });
    if(staleItems.length) refreshStocktakeTotals(st.id);
  }

  toast(code+' unlocked for re-count');
  renderPage();
  syncCodeStatus(code, data);
}
function renderActiveStocktake(st){
  var totals = recomputeStocktakeTotals(st.id);
  var codesAll = allCodes().filter(function(c){
    var info = codeInfo(c);
    if(st.category!=='all' && info.category!==st.category) return false;
    var q = state.ui.stSearch.trim().toLowerCase();
    if(!q) return true;
    if(info.code.toLowerCase().indexOf(q)>-1) return true;
    if(info.name.toLowerCase().indexOf(q)>-1) return true;
    if(info.variants.some(function(v){return (v.barcode||'').toLowerCase().indexOf(q)>-1 || colorMeta(v.color).name.toLowerCase().indexOf(q)>-1 || (v.size||'').toLowerCase().indexOf(q)>-1;})) return true;
    return false;
  });
  // Codes already marked Done (globally, from any stock take) don't appear
  // here at all — that's the whole point of the Done flag. They only come
  // back once "Activate recount" is pressed on the Products page.
  var hiddenDoneCount = codesAll.filter(function(c){ return isCodeHiddenFromStocktake(c, st); }).length;
  var codes = codesAll.filter(function(c){ return !isCodeHiddenFromStocktake(c, st); });

  var html = '';
  html += '<div class="stickybar st-controls card pad" style="margin-bottom:14px;">'+
    '<div class="chip">'+icon('clipboard','icon-sm')+esc(st.number)+'</div>'+
    '<div class="chip">'+icon('user','icon-sm')+esc(st.staff)+'</div>'+
    '<div class="chip">'+icon('warehouse','icon-sm')+esc(st.warehouse)+'</div>'+
    '<div class="chip">'+fmtDate(st.date)+'</div>'+
    '<div class="searchbar">'+icon('search')+'<input type="text" id="st-search" placeholder="Scan or search code, name, color, size" value="'+esc(state.ui.stSearch)+'"/></div>'+
  '</div>';

  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">'+
    '<div class="tabs" id="cat-tabs">'+
      tabBtn('all','All',st.category)+
      Object.keys(state.settings.categories).map(function(k){return tabBtn(k,catMeta(k).label,st.category);}).join('')+
    '</div>'+
    '<button class="btn btn-sm" id="btn-newcode">'+icon('plus','icon-sm')+' New Code</button>'+
  '</div>';

  if(hiddenDoneCount>0){
    html += '<div style="color:var(--text-2);font-size:12px;margin-bottom:12px;">'+icon('check','icon-sm')+' '+hiddenDoneCount+' code'+(hiddenDoneCount===1?'':'s')+' already Done and hidden from this list — manage them from <b>Products</b> if one needs a re-count.</div>';
  }

  html += '<div class="grid kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">'+
    kpi('Counted', totals.counted+'/'+totals.totalProducts, 'this stock take')+
    kpi('Short', fmtNum(totals.short), fmtNum(totals.shortQty)+' pcs')+
    kpi('Extra', fmtNum(totals.extra), fmtNum(totals.extraQty)+' pcs')+
    kpi('Not counted', fmtNum(totals.notCounted), 'remaining')+
  '</div>';

  if(!codes.length){
    if(codesAll.length){
      html += emptyState('check','Everything here is already Done','Activate a re-count from the Products page if one of these needs counting again, or clear the search/category filter.');
    } else {
      html += emptyState('box','No products match','Try clearing the search or category filter, or add a new code.');
    }
  } else {
    html += '<div class="grid" style="gap:10px;">'+codes.map(function(c){ return renderCodeCard(c, st); }).join('')+'</div>';
  }

  html += '<div style="position:sticky;bottom:'+(window.innerWidth<=860?'76px':'0px')+';margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:10px 0;">'+
    '<button class="btn" id="btn-save-progress">'+icon('save','icon-sm')+' Save Progress</button>'+
    '<button class="btn btn-primary" id="btn-complete-st">'+icon('check','icon-sm')+' Complete Stock Take</button>'+
    '<button class="btn" id="btn-export-st">'+icon('copy','icon-sm')+' Export</button>'+
    '<span style="margin-left:auto;color:var(--text-2);font-size:11.5px;">'+(state.ui.lastSaved?('Last saved '+fmtTime(state.ui.lastSaved)):'Not saved yet')+(pendingSyncTotal()>0?' · <span style="color:var(--warning);">'+pendingSyncTotal()+' waiting to sync</span>':'')+'</span>'+
  '</div>';

  if(state.ui.openCode){
    html += renderBracketModal(state.ui.openCode, st);
  }
  return html;
}
function tabBtn(val,label,current){ return '<button class="tab '+(current===val?'active':'')+'" data-cat-tab="'+val+'">'+label+'</button>'; }
function emptyState(ic,title,sub){
  return '<div class="card emptystate">'+icon(ic,'icon-lg')+'<div style="font-weight:800;color:var(--text);margin-bottom:4px;">'+title+'</div><div>'+sub+'</div></div>';
}

function renderCodeCard(code, st){
  var info = codeInfo(code);
  // Progress/done status is computed against the deduped cells the bracket
  // grid actually shows (orderedVariants), not the raw product list — see
  // the comment in isCodeDone for why that distinction matters.
  var cells = orderedVariants(code);
  var stId = st.id;
  var counted = cells.filter(function(v){ var it=itemFor(stId,v.id); return it && it.status!=='NOT COUNTED'; }).length;
  var pct = cells.length ? Math.round(counted/cells.length*100) : 0;
  var done = cells.length>0 && counted===cells.length;
  var otherCounter = done ? null : otherActiveCounterFor(code, st); // no need to flag it once you've already finished it here
  var swatches = uniqueColors(info.variants).slice(0,6).map(function(cc){ return '<span class="swatch" style="background:'+colorMeta(cc).hex+'"></span>'; }).join('');
  return '<div class="card codecard'+(done?' cc-done':'')+'" data-open-code="'+esc(code)+'">'+
    '<div class="cc-main">'+
      '<b>'+esc(code)+' · '+esc(info.name)+(done?' <span class="badge" style="background:var(--success-bg);color:var(--success);margin-left:6px;">'+icon('check','icon-sm')+' '+fmtDoneAt(state.codeStatus[code] && state.codeStatus[code].doneAt)+'</span>':'')+'</b>'+
      '<div class="cc-sub">'+catMeta(info.category).label+' · '+esc(info.subcategory||'')+' · '+cells.length+' variants'+(otherCounter?' · <span style="color:var(--warning);">also being counted by '+esc(otherCounter)+'</span>':'')+'</div>'+
      '<div class="progressbar"><span style="width:'+pct+'%'+(done?';background:var(--success)':'')+'"></span></div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'+
      '<div style="display:flex;gap:2px;">'+swatches+'</div>'+
      '<span style="font-size:11.5px;color:var(--text-2);font-weight:700;">'+counted+'/'+cells.length+'</span>'+
    '</div>'+
    icon('chevron')+
  '</div>';
}
function uniqueColors(variants){ var seen={}, list=[]; variants.forEach(function(v){ if(!seen[v.color]){seen[v.color]=1;list.push(v.color);} }); return list; }
function uniqueSizes(variants){ var seen={}, list=[]; variants.forEach(function(v){ if(!seen[v.size]){seen[v.size]=1;list.push(v.size);} }); return list; }

function renderBracketModal(code, st){
  var info = codeInfo(code);
  var variants = info.variants;
  var sizes = uniqueSizes(variants);
  var colors = uniqueColors(variants);
  var sizeOrder = catMeta(info.category).sizes;
  sizes.sort(function(a,b){ return sizeOrder.indexOf(a)-sizeOrder.indexOf(b); });

  var head = '<div class="bracket-head" style="grid-template-columns:60px repeat('+colors.length+',1fr);display:grid;gap:8px;">'+
    '<div></div>'+ colors.map(function(cc){ var cm=colorMeta(cc); return '<div style="text-align:center;"><span class="swatch" style="background:'+cm.hex+'"></span></div>'; }).join('') +
  '</div>';

  // Locked (read-only) only once the code is Done in a DIFFERENT stock take
  // than this one — i.e. the same rule that decides whether it's hidden from
  // this list at all (isCodeHiddenFromStocktake). A code you just finished
  // in THIS still-open stock take stays fully editable here: if you fat-
  // fingered the last box, you can tap it and fix it immediately, no need to
  // go activate a re-count from Products first. It only locks once you move
  // on to a different stock take (this one completed, or a fresh one
  // started) — that's when a change should go through "Activate re-count"
  // instead of being silently editable.
  var locked = isCodeHiddenFromStocktake(code, st);

  var rows = sizes.map(function(sz){
    var cells = colors.map(function(cc){
      var v = variants.find(function(x){return x.size===sz && x.color===cc;});
      if(!v) return '<div></div>';
      var it = itemFor(st.id, v.id);
      var phys = it ? it.physical_quantity : null;
      var stcls = it ? statusClass(it.status) : '';
      return '<div class="bcell '+(stcls?('st-'+stcls):'')+(locked?' bcell-locked':'')+'" '+(locked?'':'data-cell-product="'+v.id+'"')+'>'+
        '<div class="bc-qty num">'+(phys===null?'–':phys)+'</div>'+
        '<div class="bc-sys num">sys '+v.system_quantity+'</div>'+
      '</div>';
    }).join('');
    return '<div style="display:grid;grid-template-columns:60px repeat('+colors.length+',1fr);gap:8px;align-items:center;">'+
      '<div style="font-weight:800;font-size:12.5px;">'+esc(sz)+'</div>'+cells+
    '</div>';
  }).join('');

  var colorLegend = colors.map(function(cc){ var cm=colorMeta(cc); return '<div class="chip"><span class="swatch" style="background:'+cm.hex+'"></span>'+esc(cm.name)+'</div>'; }).join('');

  return '<div class="modal-backdrop" id="bracket-backdrop">'+
    '<div class="modal-sheet" style="max-width:560px;">'+
      '<div class="modal-head"><h3>'+esc(code)+' · '+esc(info.name)+'</h3><button class="iconbtn" id="close-bracket">'+icon('x','icon-sm')+'</button></div>'+
      (locked ? '<div class="badge" style="background:var(--success-bg);color:var(--success);margin-bottom:12px;">'+icon('check','icon-sm')+' '+fmtDoneAt(state.codeStatus[code] && state.codeStatus[code].doneAt)+' — view only. Activate a re-count from the Products page to change this.</div>' : '')+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">'+colorLegend+'</div>'+
      '<div class="bracket'+(locked?' bracket-locked':'')+'">'+head+rows+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:16px;">'+
        '<button class="btn btn-block" id="close-bracket-2">Close</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

var qtyModalCtx = null;
function renderQtyModal(){
  if(!qtyModalCtx) return '';
  var v = qtyModalCtx.product, val = qtyModalCtx.value;
  var cm = colorMeta(v.color);
  var diff = val - v.system_quantity;
  var status = computeStatus(v.system_quantity, val);
  return '<div class="modal-backdrop center" id="qty-backdrop">'+
    '<div class="modal-sheet" style="max-width:340px;">'+
      '<div class="modal-head"><h3>'+esc(v.code)+' · '+esc(v.size)+'</h3><button class="iconbtn" id="close-qty">'+icon('x','icon-sm')+'</button></div>'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span class="swatch" style="background:'+cm.hex+'"></span><b>'+esc(cm.name)+'</b>'+statusBadge(status)+'</div>'+
      '<div class="keypad-display"><div class="qtybig num">'+val+'</div><div class="sysline">System qty: '+v.system_quantity+' &nbsp;·&nbsp; Diff: <b class="num">'+(diff>0?'+':'')+diff+'</b></div></div>'+
      '<div class="stepper">'+
        '<button class="stepbtn" data-step="-5">−5</button>'+
        '<button class="stepbtn" data-step="-1">−</button>'+
        '<button class="stepbtn" data-step="1">+</button>'+
        '<button class="stepbtn" data-step="5">+5</button>'+
      '</div>'+
      '<div class="keypad">'+
        [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-key="'+n+'">'+n+'</button>';}).join('')+
        '<button data-key="clear">C</button><button data-key="0">0</button><button data-key="back">⌫</button>'+
      '</div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button class="btn btn-block" id="qty-save-close">Save & Close</button>'+
        '<button class="btn btn-primary btn-block" id="qty-save-next">Save & Next</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function openCellModal(productId){
  var v = state.products.find(function(p){return p.id===productId;});
  if(!v) return;
  var st = activeStocktake();
  // Belt-and-suspenders: a locked code's cells already have no
  // data-cell-product attribute, so this shouldn't normally be reachable —
  // but refuse here too rather than trust only the UI not rendering it. Same
  // same-session-stays-editable rule as the bracket lock itself.
  if(isCodeHiddenFromStocktake(v.code, st)){ toast(v.code+' is Done — activate re-count from Products'); return; }
  var it = itemFor(st.id, v.id);
  qtyModalCtx = { product:v, value: it ? it.physical_quantity : v.system_quantity };
  syncModals();
}
function closeCellModal(){ qtyModalCtx=null; syncModals(); }

/* Shown once every cell in a code is filled in, BEFORE the code is marked
   Done. The stock take's "system quantity" (shown on Products/Dashboard)
   is a separate number from what you just physically counted — this is
   the one confirm step where you decide whether the count should correct
   that record, code by code, rather than it happening silently every time
   or never happening at all. */
var applyCountCtx = null;
function renderApplyCountModal(){
  if(!applyCountCtx) return '';
  var st = state.stocktakes.find(function(s){return s.id===applyCountCtx.stId;});
  if(!st) return '';
  var code = applyCountCtx.code;
  var rows = orderedVariants(code).map(function(v){
    var it = itemFor(st.id, v.id);
    var phys = it ? it.physical_quantity : v.system_quantity;
    return { v:v, phys:phys, diff: phys - v.system_quantity };
  });
  var changed = rows.filter(function(r){ return r.diff!==0; });
  var totalDiff = changed.reduce(function(a,r){return a+r.diff;},0);
  return '<div class="modal-backdrop center" id="applycount-backdrop">'+
    '<div class="modal-sheet" style="max-width:420px;">'+
      '<div class="modal-head"><h3>'+esc(code)+' — finished counting</h3></div>'+
      (changed.length
        ? '<div style="color:var(--text-2);font-size:12.5px;margin-bottom:10px;">These came out different from the system quantity:</div>'+
          '<div class="table-wrap" style="margin-bottom:14px;"><table><thead><tr><th>Size</th><th>Color</th><th>System</th><th>Counted</th><th>Diff</th></tr></thead><tbody>'+
            changed.map(function(r){
              var cm = colorMeta(r.v.color);

        : '<div style="color:var(--text-2);font-size:12.5px;margin-bottom:14px;">Every size/color matched the system quantity exactly — nothing to update.</div>')+
      '<div style="display:flex;gap:8px;">'+

// Writes the just-counted physical quantities into vhm_stocktake_products'
// system_quantity for this code (only for variants that actually changed),
// so Products/Dashboard reflect the real shelf count going forward. This
// only touches this tool's own product records, not any other VHM app's
// catalog data.
function applyCountToSystemQty(code, st){
  var writes = [];
  orderedVariants(code).forEach(function(v){
    var it = itemFor(st.id, v.id);
    var phys = it ? it.physical_quantity : v.system_quantity;
    if(phys === v.system_quantity) return;
    var idx = state.products.findIndex(function(p){return p.id===v.id;});
    if(idx>-1) state.products[idx] = Object.assign({}, state.products[idx], {system_quantity: phys});
    writes.push(state.db.collection('vhm_stocktake_products').doc(v.id).update({system_quantity: phys}).catch(function(e){
      console.error('Could not apply counted qty for '+v.id, e);
      toast(code+': some quantities may not have saved to Products — check and retry from there', 5000);
    }));
  });
  return Promise.all(writes);
}

/* Single source of truth for the floating modal layer: always rebuilt
   from current modal state, never by reading/appending previous innerHTML
   (that pattern duplicates nodes when a data snapshot re-render fires
   while a modal is open). */
function syncModals(){
  var parts = [];
  if(newCodeCtx) parts.push(renderNewCodeModal());
  if(qtyModalCtx) parts.push(renderQtyModal());
  if(applyCountCtx) parts.push(renderApplyCountModal());
  if(state.ui.moreOpen) parts.push(renderMoreSheetHtml());
  document.getElementById('modalRoot').innerHTML = parts.join('');
  // passcodeCtx, confirmCtx, export and product/history detail modals are
  // opened as one-off innerHTML writes (see their own open* functions) —
  // they intentionally aren't rebuilt here.
}

/* Color-major order: every size of one color, top to bottom, before moving
   to the next color — matches the bracket sheet layout (finish a color's
   column, then move on) rather than jumping color-to-color after each cell. */
function orderedVariants(code){
  var info = codeInfo(code);
  var colors = uniqueColors(info.variants);
  var sizeOrder = catMeta(info.category).sizes;
  var sizes = uniqueSizes(info.variants).slice().sort(function(a,b){ return sizeOrder.indexOf(a)-sizeOrder.indexOf(b); });
  var seq = [];
  colors.forEach(function(cc){
    sizes.forEach(function(sz){
      var v = info.variants.find(function(x){ return x.color===cc && x.size===sz; });
      if(v) seq.push(v);
    });
  });
  return seq;
}
function nextUncountedInGrid(code, currentProductId, stId){
  var seq = orderedVariants(code);
  var idx = seq.findIndex(function(v){return v.id===currentProductId;});
  if(idx===-1) idx = 0;
  for(var i=1;i<=seq.length;i++){
    var v = seq[(idx+i)%seq.length];
    var it = itemFor(stId, v.id);
    if(!it){ return v; }
  }
  return null;
}

// Shared by the Products list and its Export modal, so the export always
// matches whatever's currently filtered/sorted on screen rather than
// silently exporting everything.
function filteredSortedProductCodes(){
  var q = state.ui.productsSearch.trim().toLowerCase();
  var cat = state.ui.productsCategory;
  var from = state.ui.productsDoneFrom, to = state.ui.productsDoneTo;
  var codes = allCodes().filter(function(c){
    var info = codeInfo(c);
    if(cat!=='all' && info.category!==cat) return false;
    if(q && info.code.toLowerCase().indexOf(q)===-1 && info.name.toLowerCase().indexOf(q)===-1 &&
       !info.variants.some(function(v){ return (v.location||'').toLowerCase().indexOf(q)>-1 || colorMeta(v.color).name.toLowerCase().indexOf(q)>-1 || (v.size||'').toLowerCase().indexOf(q)>-1 || (v.barcode||'').toLowerCase().indexOf(q)>-1; })) return false;
    if(state.ui.productsNeedsTransferOnly && !codeNeedsTransfer(c)) return false;
    if(from || to){
      var doneAt = state.codeStatus[c] && state.codeStatus[c].doneAt;
      if(!doneAt) return false; // not counted at all — can't match a date filter
      var d = new Date(doneAt).toISOString().slice(0,10);
      if(from && d < from) return false;
      if(to && d > to) return false;
    }
    return true;
  });
  if(state.ui.productsSort==='newest' || state.ui.productsSort==='oldest'){
    var dir = state.ui.productsSort==='newest' ? -1 : 1;
    codes = codes.slice().sort(function(a,b){
      var da = (state.codeStatus[a]&&state.codeStatus[a].doneAt)||0;
      var db = (state.codeStatus[b]&&state.codeStatus[b].doneAt)||0;
      if(!da && !db) return a.localeCompare(b);
      if(!da) return 1; // uncounted codes sort to the bottom either way
      if(!db) return -1;
      return dir*(da-db);
    });
  } else {
    codes = codes.slice().sort(function(a,b){ return a.localeCompare(b); });
  }
  return codes;
}

  if(!codes.length){ html += emptyState('tag','No products found','Try another search, category or date range.'); return html; }
